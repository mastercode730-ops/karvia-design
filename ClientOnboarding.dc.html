<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karvia · Your details</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Hind',system-ui,sans-serif;color:#13213C;background:#F4F6F9}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.1}
p{margin:0}
a{color:#0B6E4F}a:hover{color:#08523B}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-tpl">
<div style="min-height:900px;background:#F4F6F9;display:flex;flex-direction:column">
  <header style="background:#FFFFFF;border-bottom:1px solid #E3E6EB">
    <div style="max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
      <a href="Main.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#13213C"><span style="width:34px;height:34px;border-radius:10px;background:#0B6E4F;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font:800 20px 'Baloo 2',sans-serif">K</span><span style="font:800 24px 'Baloo 2',sans-serif">karvia</span></a>
      <div style="display:flex;gap:8px;align-items:center;font-size:14px;color:#5E6B7D"><span style="width:28px;height:6px;border-radius:3px;background:#0B6E4F"></span><span style="width:28px;height:6px;border-radius:3px;background:#0B6E4F"></span><span style="width:28px;height:6px;border-radius:3px;background:#CBD2DB"></span><span>Step 2 of 3</span></div>
    </div>
  </header>
  <div style="flex:1;display:flex;justify-content:center;padding:48px 24px">
    <div style="width:100%;max-width:560px;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;flex-direction:column;gap:6px"><h1 style="font-size:34px;font-weight:800">Tell us your name and location</h1><p style="color:#5E6B7D">We use your location to show workers within 5 KM of your job.</p></div>
      <div style="display:flex;flex-direction:column;gap:6px"><label for="nm" style="font-weight:600">Your name</label><input id="nm" value="Priya Sharma" style="padding:14px;border:1px solid #CBD2DB;border-radius:12px;font:inherit;font-size:17px"></div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <span style="font-weight:600">Location</span>
        <button style="display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;border-radius:12px;border:2px solid #0B6E4F;background:#E3F2EC;color:#0B6E4F;font:600 16px Hind,sans-serif;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6E4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path></svg>Use my current location (GPS)</button>
        <div style="display:flex;align-items:center;gap:10px;color:#5E6B7D;font-size:14px"><span style="flex:1;height:1px;background:#E3E6EB"></span>or enter manually<span style="flex:1;height:1px;background:#E3E6EB"></span></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <div style="flex:2 1 200px;display:flex;flex-direction:column;gap:6px"><label for="ar" style="font-size:14px;color:#3D4A5C">City / area</label><input id="ar" value="Sector 62, Noida" style="padding:13px;border:1px solid #CBD2DB;border-radius:12px;font:inherit;font-size:16px"></div>
          <div style="flex:1 1 120px;display:flex;flex-direction:column;gap:6px"><label for="pc" style="font-size:14px;color:#3D4A5C">Pincode</label><input id="pc" value="201309" inputmode="numeric" style="padding:13px;border:1px solid #CBD2DB;border-radius:12px;font:inherit;font-size:16px"></div>
        </div>
        <div style="height:150px;border-radius:12px;background:#E9EEF3;position:relative;overflow:hidden;border:1px solid #E3E6EB">
          <div style="position:absolute;inset:0;background-image:linear-gradient(#DCE3EA 1px,transparent 1px),linear-gradient(90deg,#DCE3EA 1px,transparent 1px);background-size:30px 30px"></div>
          <div style="position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(11,110,79,.12);border:1px dashed #0B6E4F"></div>
          <div style="position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#0B6E4F;border:3px solid #FFFFFF"></div>
          <span style="position:absolute;right:10px;bottom:8px;font-size:12px;color:#3D4A5C;background:#FFFFFF;padding:2px 8px;border-radius:6px">Map preview · 5 KM</span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px"><label for="em" style="font-weight:600">Email <span style="font-weight:400;color:#5E6B7D">(optional)</span></label><input id="em" placeholder="For receipts and booking updates" style="padding:14px;border:1px solid #CBD2DB;border-radius:12px;font:inherit;font-size:16px"></div>
      <label style="display:flex;gap:10px;align-items:flex-start;font-size:15px"><input type="checkbox" checked style="width:20px;height:20px;margin-top:2px"> I agree to the <a href="Legal.dc.html">Terms</a> and <a href="Legal.dc.html">Privacy Policy</a></label>
      <a href="ClientAccess.dc.html" style="padding:15px;border-radius:12px;background:#0B6E4F;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:17px;text-align:center">Continue</a>
    </div>
  </div>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
<a href="screens.html" style="position:fixed;right:16px;bottom:16px;z-index:999;padding:10px 14px;border-radius:999px;background:#13213C;color:#FFFFFF;font:600 14px Hind,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px -8px rgba(19,33,60,.5)">All screens</a>
<script src="support.js"></script>
</body>
</html>
