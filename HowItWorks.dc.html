<body>

<script type="text/x-dc-template" id="dc-tpl">
<div style="background:#FFFFFF">
<header style="border-bottom:1px solid #E3E6EB">
  <div style="max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 32px">
    <a href="Main.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#13213C"><span style="width:36px;height:36px;border-radius:10px;background:#0B6E4F;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font:800 22px 'Baloo 2',sans-serif">K</span><span style="font:800 26px 'Baloo 2',sans-serif">karvia</span></a>
    <nav style="display:flex;flex-wrap:wrap;gap:4px 22px;flex:1 1 360px;font-weight:500">
      <a href="HowItWorks.dc.html" style="color:#0B6E4F;text-decoration:none;padding:10px 0;font-weight:700;border-bottom:2px solid #0B6E4F">How Karvia works</a>
      <a href="Categories.dc.html" style="color:#13213C;text-decoration:none;padding:10px 0">Categories</a>
      <a href="BecomeWorker.dc.html" style="color:#13213C;text-decoration:none;padding:10px 0">Become a worker</a>
      <a href="TopWorkers.dc.html" style="color:#13213C;text-decoration:none;padding:10px 0">Top workers</a>
      <a href="Help.dc.html" style="color:#13213C;text-decoration:none;padding:10px 0">Help</a>
    </nav>
    <div style="display:flex;gap:10px"><a href="Login.dc.html" style="padding:11px 18px;border-radius:10px;border:1px solid #CBD2DB;color:#13213C;text-decoration:none;font-weight:600">Login</a><a href="Login.dc.html" style="padding:11px 18px;border-radius:10px;background:#0B6E4F;color:#FFFFFF;text-decoration:none;font-weight:600">Find a worker</a></div>
  </div>
</header>

<section style="background:#F4F6F9">
  <div style="max-width:1200px;margin:0 auto;padding:64px 24px 48px;display:flex;flex-direction:column;gap:14px">
    <span style="font-weight:600;color:#0B6E4F;letter-spacing:.08em;text-transform:uppercase;font-size:13px">How Karvia works</span>
    <h1 style="font-size:56px;font-weight:800;max-width:18ch">Simple for you. The hard work happens behind the screen.</h1>
    <p style="font-size:19px;color:#3D4A5C;max-width:60ch;line-height:1.5">You never need to understand matching, verification or subscriptions. Pick what you need and where. Karvia finds the right verified worker nearby.</p>
  </div>
</section>

<section>
  <div style="max-width:1200px;margin:0 auto;padding:56px 24px;display:flex;flex-direction:column;gap:20px">
    <h2 style="font-size:34px">If you need a worker</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">
      <div style="border:1px solid #E3E6EB;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px"><span style="font:800 15px 'Baloo 2',sans-serif;color:#0B6E4F">STEP 1</span><h3 style="font-size:22px">Mobile + OTP</h3><p style="color:#3D4A5C;line-height:1.5">Add your name and location by GPS, area or pincode. Email is optional.</p></div>
      <div style="border:1px solid #E3E6EB;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px"><span style="font:800 15px 'Baloo 2',sans-serif;color:#0B6E4F">STEP 2</span><h3 style="font-size:22px">Pay ₹9 for 30 days</h3><p style="color:#3D4A5C;line-height:1.5">Access unlocks only after the payment is confirmed. No refund after activation, no auto-renewal.</p></div>
      <div style="border:1px solid #E3E6EB;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px"><span style="font:800 15px 'Baloo 2',sans-serif;color:#0B6E4F">STEP 3</span><h3 style="font-size:22px">Choose a service</h3><p style="color:#3D4A5C;line-height:1.5">Category, then service. See workers within 5 KM with experience, skills, price, rating and availability.</p></div>
      <div style="border:1px solid #E3E6EB;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px"><span style="font:800 15px 'Baloo 2',sans-serif;color:#0B6E4F">STEP 4</span><h3 style="font-size:22px">Send a request</h3><p style="color:#3D4A5C;line-height:1.5">Pick instant, scheduled or quote. Describe the work in text or voice, add a photo.</p></div>
      <div style="border:1px solid #E3E6EB;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px"><span style="font:800 15px 'Baloo 2',sans-serif;color:#0B6E4F">STEP 5</span><h3 style="font-size:22px">First to accept wins</h3><p style="color:#3D4A5C;line-height:1.5">Nearby workers have 60 seconds. The first to accept is locked in; others see "already assigned".</p></div>
      <div style="border:1px solid #E3E6EB;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px"><span style="font:800 15px 'Baloo 2',sans-serif;color:#0B6E4F">STEP 6</span><h3 style="font-size:22px">Job, then review</h3><p style="color:#3D4A5C;line-height:1.5">Pay the worker directly. Rate them, save them as a favourite, or report a problem.</p></div>
    </div>
  </div>
</section>

<section style="background:#13213C">
  <div style="max-width:1200px;margin:0 auto;padding:56px 24px;display:flex;flex-direction:column;gap:22px">
    <h2 style="font-size:34px;color:#FFFFFF">What happens after you tap "Send request"</h2>
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:#FFFFFF;font-weight:600">
      <span style="padding:10px 14px;border-radius:10px;background:#22314F">Requested</span><span style="color:#8D9AB0">→</span>
      <span style="padding:10px 14px;border-radius:10px;background:#22314F">Searching within 5 KM</span><span style="color:#8D9AB0">→</span>
      <span style="padding:10px 14px;border-radius:10px;background:#22314F">Sent to eligible workers</span><span style="color:#8D9AB0">→</span>
      <span style="padding:10px 14px;border-radius:10px;background:#0B6E4F">Accepted &amp; locked</span><span style="color:#8D9AB0">→</span>
      <span style="padding:10px 14px;border-radius:10px;background:#22314F">Confirmed</span><span style="color:#8D9AB0">→</span>
      <span style="padding:10px 14px;border-radius:10px;background:#22314F">In progress</span><span style="color:#8D9AB0">→</span>
      <span style="padding:10px 14px;border-radius:10px;background:#22314F">Completed</span>
    </div>
    <p style="color:#C3CCDA;max-width:70ch;line-height:1.55">If nobody accepts in time you'll see "No worker accepted yet. Aapki search jaari hai, suitable worker milte hi notify kiya jayega." The search area can grow from 5 to 10 to 15 KM.</p>
  </div>
</section>

<section>
  <div style="max-width:1200px;margin:0 auto;padding:56px 24px;display:flex;flex-direction:column;gap:20px">
    <h2 style="font-size:34px">If you want work</h2>
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:stretch">
      <div style="flex:1 1 150px;background:#FFF3DC;border-radius:14px;padding:16px"><b>Register</b><p style="font-size:14px;color:#3D4A5C;margin-top:4px">Mobile + OTP. Save anytime.</p></div>
      <div style="flex:1 1 150px;background:#FFF3DC;border-radius:14px;padding:16px"><b>Profile</b><p style="font-size:14px;color:#3D4A5C;margin-top:4px">Skills, price, photos, history</p></div>
      <div style="flex:1 1 150px;background:#FFF3DC;border-radius:14px;padding:16px"><b>Documents</b><p style="font-size:14px;color:#3D4A5C;margin-top:4px">Kept private</p></div>
      <div style="flex:1 1 150px;background:#E3F2EC;border-radius:14px;padding:16px"><b>Verified</b><p style="font-size:14px;color:#3D4A5C;margin-top:4px">By Karvia admin</p></div>
      <div style="flex:1 1 150px;background:#E3F2EC;border-radius:14px;padding:16px"><b>Free trial</b><p style="font-size:14px;color:#3D4A5C;margin-top:4px">Then ₹199 / 30 days</p></div>
      <div style="flex:1 1 150px;background:#E3F2EC;border-radius:14px;padding:16px"><b>AVAILABLE on</b><p style="font-size:14px;color:#3D4A5C;margin-top:4px">Start receiving requests</p></div>
    </div>
  </div>
</section>

<section style="background:#F4F6F9">
  <div style="max-width:1200px;margin:0 auto;padding:56px 24px;display:flex;flex-direction:column;gap:18px">
    <h2 style="font-size:34px">When does contact unlock?</h2>
    <div style="overflow-x:auto;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px">
      <table style="width:100%;border-collapse:collapse;min-width:640px;font-size:16px">
        <thead><tr style="text-align:left;background:#F4F6F9"><th style="padding:14px 18px">Stage</th><th style="padding:14px 18px">What you can see</th></tr></thead>
        <tbody>
          <tr><td style="padding:14px 18px;border-top:1px solid #E3E6EB;font-weight:600">Before ₹9 payment</td><td style="padding:14px 18px;border-top:1px solid #E3E6EB">Categories only. No profiles, prices or contact.</td></tr>
          <tr><td style="padding:14px 18px;border-top:1px solid #E3E6EB;font-weight:600">After ₹9 payment</td><td style="padding:14px 18px;border-top:1px solid #E3E6EB">Full worker profiles, prices, reviews. Follow and favourite.</td></tr>
          <tr><td style="padding:14px 18px;border-top:1px solid #E3E6EB;font-weight:600">After you send a request</td><td style="padding:14px 18px;border-top:1px solid #E3E6EB">In-app messages about that request.</td></tr>
          <tr><td style="padding:14px 18px;border-top:1px solid #E3E6EB;font-weight:600">After the worker accepts</td><td style="padding:14px 18px;border-top:1px solid #E3E6EB">Masked call and chat. Exact address is never public.</td></tr>
        </tbody>
      </table>
    </div>
    <a href="Login.dc.html" style="align-self:flex-start;padding:15px 24px;border-radius:12px;background:#0B6E4F;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:17px">Find a worker near me</a>
  </div>
</section>
</div>
