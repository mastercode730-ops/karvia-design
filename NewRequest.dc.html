<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karvia · New request</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Hind',system-ui,sans-serif;color:#13213C;background:#F4F6F9}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.1}
p{margin:0}
a{color:#0B6E4F}a:hover{color:#08523B}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-tpl">
<div style="min-height:1500px;background:#F4F6F9">
<header style="background:#FFFFFF;border-bottom:1px solid #E3E6EB">
  <div style="max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px">
    <a href="ClientDashboard.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#13213C"><span style="width:34px;height:34px;border-radius:10px;background:#0B6E4F;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font:800 20px 'Baloo 2',sans-serif">K</span><span style="font:800 24px 'Baloo 2',sans-serif">karvia</span></a>
    <nav style="display:flex;flex-wrap:wrap;gap:4px;flex:1 1 480px;font-weight:500;font-size:15px">
      <a href="ClientDashboard.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">Home</a>
      <a href="FindWorkers.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">Find worker</a>
      <a href="RequestStatus.dc.html" style="padding:9px 12px;border-radius:9px;background:#E3F2EC;color:#0B6E4F;font-weight:700;text-decoration:none">My requests</a>
      <a href="MyBookings.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">My bookings</a>
      <a href="MyWorkers.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">My workers</a>
    </nav>
    <a href="Payments.dc.html" style="padding:7px 12px;border-radius:999px;background:#FFF3DC;color:#8A5A00;font-size:14px;font-weight:600;text-decoration:none">₹9 access · 22 days left</a>
  </div>
</header>

<main style="max-width:1240px;margin:0 auto;padding:28px 24px 56px;display:flex;flex-direction:column;gap:18px">
  <h1 style="font-size:40px;font-weight:800">New request</h1>
  <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
    <form style="flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:16px">
      <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px">
        <h2 style="font-size:22px">1 · What do you need?</h2>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <div style="flex:1 1 180px;display:flex;flex-direction:column;gap:6px"><label for="c1" style="font-weight:600;font-size:14px">Category</label><select id="c1" style="padding:12px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"><option>Home repair</option></select></div>
          <div style="flex:1 1 180px;display:flex;flex-direction:column;gap:6px"><label for="c2" style="font-weight:600;font-size:14px">Sub-category</label><select id="c2" style="padding:12px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"><option>Plumber</option></select></div>
          <div style="flex:1 1 180px;display:flex;flex-direction:column;gap:6px"><label for="c3" style="font-weight:600;font-size:14px">Service</label><select id="c3" style="padding:12px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"><option>Tap / leak repair</option></select></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px"><label for="rq" style="font-weight:600;font-size:14px">Describe the work</label><textarea id="rq" rows="3" style="padding:12px;border-radius:10px;border:1px solid #CBD2DB;font:inherit;resize:vertical">Kitchen tap is leaking from the base. Need it fixed or replaced.</textarea></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button type="button" style="display:flex;gap:8px;align-items:center;padding:11px 14px;border-radius:10px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 14px Hind,sans-serif;color:#13213C;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#13213C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path></svg>Record voice note</button>
          <button type="button" style="display:flex;gap:8px;align-items:center;padding:11px 14px;border-radius:10px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 14px Hind,sans-serif;color:#13213C;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#13213C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="12" cy="12" r="3"></circle></svg>Add photo</button>
          <div style="display:flex;gap:8px;align-items:center;margin-left:auto"><label for="qty" style="font-size:14px;font-weight:600">Workers needed</label><input id="qty" value="1" style="width:56px;padding:10px;border-radius:10px;border:1px solid #CBD2DB;font:inherit;text-align:center"></div>
        </div>
        <div style="background:#F4F6F9;border-radius:12px;padding:12px 14px;font-size:14px;color:#3D4A5C"><b>Voice tip:</b> say "Mujhe kal subah do mazdoor chahiye" and we'll fill category, quantity and time for you to confirm.</div>
      </section>

      <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px">
        <h2 style="font-size:22px">2 · When?</h2>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
          <button type="button" onClick="{{pickInstant}}" style="{{instantStyle}}"><b style="display:block;font-size:16px">Instant</b><span style="font-size:13px">As soon as possible</span></button>
          <button type="button" onClick="{{pickScheduled}}" style="{{scheduledStyle}}"><b style="display:block;font-size:16px">Scheduled</b><span style="font-size:13px">Pick a date and time</span></button>
          <button type="button" onClick="{{pickQuote}}" style="{{quoteStyle}}"><b style="display:block;font-size:16px">Request quote</b><span style="font-size:13px">For big or unclear jobs</span></button>
        </div>
        <sc-if value="{{showDate}}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <div style="flex:1 1 200px;display:flex;flex-direction:column;gap:6px"><label for="dt" style="font-weight:600;font-size:14px">Date</label><input id="dt" type="date" value="2026-10-11" style="padding:12px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"></div>
            <div style="flex:1 1 200px;display:flex;flex-direction:column;gap:6px"><label for="tm" style="font-weight:600;font-size:14px">Time</label><input id="tm" type="time" value="10:00" style="padding:12px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"></div>
          </div>
          <p style="font-size:13px;color:#5E6B7D">Minimum notice for this service: 2 hours. Up to 15 days ahead.</p>
        </sc-if>
      </section>

      <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px">
        <h2 style="font-size:22px">3 · Where?</h2>
        <div style="display:flex;gap:12px;align-items:center;padding:14px;border:1px solid #CBD2DB;border-radius:12px;flex-wrap:wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B6E4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
          <div style="flex:1 1 240px"><b>Home · B-204, Sector 62, Noida 201309</b><p style="font-size:13px;color:#5E6B7D">Shared with the worker only after they accept</p></div>
          <a href="ClientProfile.dc.html" style="font-weight:600">Change</a>
        </div>
      </section>
    </form>

    <aside style="flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:14px">
      <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px">
        <h2 style="font-size:22px">Summary</h2>
        <div style="display:grid;grid-template-columns:1fr auto;gap:8px;font-size:15px">
          <span style="color:#5E6B7D">Service</span><span>Tap / leak repair</span>
          <span style="color:#5E6B7D">Type</span><b>{{typeLabel}}</b>
          <span style="color:#5E6B7D">When</span><span>{{whenLabel}}</span>
          <span style="color:#5E6B7D">Search area</span><span>5 KM</span>
        </div>
        <div style="background:#F4F6F9;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px">
          <span style="font-size:13px;font-weight:600;color:#5E6B7D;text-transform:uppercase;letter-spacing:.06em">Price guide</span>
          <b style="font:800 26px 'Baloo 2',sans-serif">{{priceLabel}}</b>
          <p style="font-size:13px;color:#5E6B7D">{{priceNote}}</p>
        </div>
        <a href="RequestStatus.dc.html" style="padding:16px;border-radius:12px;background:#0B6E4F;color:#FFFFFF;text-decoration:none;font-weight:700;text-align:center;font-size:17px">{{cta}}</a>
        <p style="font-size:13px;color:#5E6B7D;line-height:1.5">Included in your ₹9 access. You pay the worker directly after the job.</p>
      </div>
    </aside>
  </div>
</main>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { type: 'scheduled' }; }
  renderVals() {
    const t = this.state.type;
    const on = 'text-align:left;padding:14px;border-radius:12px;border:2px solid #0B6E4F;background:#E3F2EC;color:#0B6E4F;font-family:Hind,sans-serif;cursor:pointer';
    const off = 'text-align:left;padding:14px;border-radius:12px;border:2px solid #E3E6EB;background:#FFFFFF;color:#3D4A5C;font-family:Hind,sans-serif;cursor:pointer';
    const map = {
      instant:   { typeLabel:'Instant', whenLabel:'Now', priceLabel:'₹300 + ₹500/hr', priceNote:'Visit ₹300, first hour ₹500, then ₹250/hr. Material extra.', cta:'Send to nearby workers' },
      scheduled: { typeLabel:'Scheduled', whenLabel:'Sat 11 Oct, 10:00 AM', priceLabel:'₹300 + ₹500/hr', priceNote:'Visit ₹300, first hour ₹500, then ₹250/hr. Material extra.', cta:'Send request' },
      quote:     { typeLabel:'Request quote', whenLabel:'Flexible', priceLabel:'Quotes in ~30 min', priceNote:'Several workers can quote. Each quote is valid for 30 minutes. Accept one.', cta:'Ask for quotes' }
    };
    return Object.assign({}, map[t], {
      instantStyle: t==='instant'?on:off, scheduledStyle: t==='scheduled'?on:off, quoteStyle: t==='quote'?on:off,
      showDate: t==='scheduled',
      pickInstant: () => this.setState({ type:'instant' }),
      pickScheduled: () => this.setState({ type:'scheduled' }),
      pickQuote: () => this.setState({ type:'quote' })
    });
  }
}
</script>
<a href="screens.html" style="position:fixed;right:16px;bottom:16px;z-index:999;padding:10px 14px;border-radius:999px;background:#13213C;color:#FFFFFF;font:600 14px Hind,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px -8px rgba(19,33,60,.5)">All screens</a>
<script src="support.js"></script>
</body>
</html>
