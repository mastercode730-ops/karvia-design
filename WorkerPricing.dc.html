<div style="min-height:1500px;background:#F4F6F9">
<header style="background:#13213C">
  <div style="max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px">
    <a href="WorkerDashboard.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#FFFFFF"><span style="width:34px;height:34px;border-radius:10px;background:#F4A51C;color:#13213C;display:flex;align-items:center;justify-content:center;font:800 20px 'Baloo 2',sans-serif">K</span><span style="font:800 24px 'Baloo 2',sans-serif">karvia</span><span style="font-size:13px;font-weight:600;padding:3px 8px;border-radius:6px;background:#22314F;color:#F4A51C">WORKER</span></a>
    <nav style="display:flex;flex-wrap:wrap;gap:4px;flex:1 1 520px;font-weight:500;font-size:15px">
      <a href="WorkerDashboard.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Dashboard</a>
      <a href="WorkerJobs.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Requests &amp; jobs</a>
      <a href="WorkerPricing.dc.html" style="padding:9px 12px;border-radius:9px;background:#22314F;color:#FFFFFF;font-weight:700;text-decoration:none">Services &amp; pricing</a>
      <a href="WorkerProfileEdit.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Profile</a>
      <a href="WorkerDocuments.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Documents</a>
      <a href="WorkerSubscription.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">My plan</a>
      <a href="WorkerReviews.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Reviews</a>
      <a href="WorkerMeetings.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Meetings</a>
    </nav>
    <span style="padding:7px 12px;border-radius:999px;background:#0B6E4F;color:#FFFFFF;font-size:13px;font-weight:700">● AVAILABLE</span>
  </div>
</header>

<main style="max-width:1240px;margin:0 auto;padding:28px 24px 56px;display:flex;flex-direction:column;gap:18px">
  <div><h1 style="font-size:40px;font-weight:800">My services &amp; pricing</h1><p style="color:#5E6B7D;margin-top:4px">Changing a price affects new bookings only. Confirmed bookings keep the agreed price.</p></div>
  <div style="display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start">
    <section style="flex:999 1 600px;min-width:0;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="font-size:22px">Plumber · rate card</h2><a href="#" style="font-weight:600">+ Add rate</a></div>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:620px;font-size:15px">
        <thead><tr style="text-align:left;color:#5E6B7D;font-size:13px;text-transform:uppercase;letter-spacing:.05em"><th style="padding:10px;border-bottom:1px solid #E3E6EB">Service / item</th><th style="padding:10px;border-bottom:1px solid #E3E6EB">Pricing model</th><th style="padding:10px;border-bottom:1px solid #E3E6EB">Rate (₹)</th><th style="padding:10px;border-bottom:1px solid #E3E6EB">Booking types</th><th style="padding:10px;border-bottom:1px solid #E3E6EB"></th></tr></thead>
        <tbody>
          <tr><td style="padding:10px;border-bottom:1px solid #E3E6EB">Visit charge</td><td style="padding:10px;border-bottom:1px solid #E3E6EB"><select aria-label="Model" style="padding:8px;border-radius:8px;border:1px solid #CBD2DB;font:inherit"><option>Per visit</option></select></td><td style="padding:10px;border-bottom:1px solid #E3E6EB"><input aria-label="Rate" value="300" style="width:90px;padding:8px;border-radius:8px;border:1px solid #CBD2DB;font:inherit"></td><td style="padding:10px;border-bottom:1px solid #E3E6EB;font-size:13px">Instant · Scheduled</td><td style="padding:10px;border-bottom:1px solid #E3E6EB"><a href="#">Remove</a></td></tr>
          <tr><td style="padding:10px;border-bottom:1px solid #E3E6EB">First hour</td><td style="padding:10px;border-bottom:1px solid #E3E6EB"><select aria-label="Model" style="padding:8px;border-radius:8px;border:1px solid #CBD2DB;font:inherit"><option>Per hour</option></select></td><td style="padding:10px;border-bottom:1px solid #E3E6EB"><input aria-label="Rate" value="500" style="width:90px;padding:8px;border-radius:8px;border:1px solid #CBD2DB;font:inherit"></td><td style="padding:10px;border-bottom:1px solid #E3E6EB;font-size:13px">Instant · Scheduled</td><td style="padding:10px;border-bottom:1px solid #E3E6EB"><a href="#">Remove</a></td></tr>
          <tr><td style="padding:10px;border-bottom:1px solid #E3E6EB">Additional hour</td><td style="padding:10px;border-bottom:1px solid #E3E6EB"><select aria-label="Model" style="padding:8px;border-radius:8px;border:1px solid #CBD2DB;font:inherit"><option>Per hour</option></select></td><td style="padding:10px;border-bottom:1px solid #E3E6EB"><input aria-label="Rate" value="250" style="width:90px;padding:8px;border-radius:8px;border:1px solid #CBD2DB;font:inherit"></td><td style="padding:10px;border-bottom:1px solid #E3E6EB;font-size:13px">Instant · Scheduled</td><td style="padding:10px;border-bottom:1px solid #E3E6EB"><a href="#">Remove</a></td></tr>
          <tr><td style="padding:10px;border-bottom:1px solid #E3E6EB">Emergency visit</td><td style="padding:10px;border-bottom:1px solid #E3E6EB"><select aria-label="Model" style="padding:8px;border-radius:8px;border:1px solid #CBD2DB;font:inherit"><option>Per visit</option></select></td><td style="padding:10px;border-bottom:1px solid #E3E6EB"><input aria-label="Rate" value="700" style="width:90px;padding:8px;border-radius:8px;border:1px solid #CBD2DB;font:inherit"></td><td style="padding:10px;border-bottom:1px solid #E3E6EB;font-size:13px">Instant</td><td style="padding:10px;border-bottom:1px solid #E3E6EB"><a href="#">Remove</a></td></tr>
          <tr><td style="padding:10px">Full pipeline work</td><td style="padding:10px"><select aria-label="Model" style="padding:8px;border-radius:8px;border:1px solid #CBD2DB;font:inherit"><option>Custom quote</option></select></td><td style="padding:10px;color:#5E6B7D">—</td><td style="padding:10px;font-size:13px">Quote</td><td style="padding:10px"><a href="#">Remove</a></td></tr>
        </tbody>
      </table></div>
      <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" checked style="width:18px;height:18px"> Material is charged at actual cost and shown separately</label>
      <p style="font-size:13px;color:#5E6B7D">Models allowed for Plumber (set by admin): Per visit, Per hour, Per job, Custom quote.</p>
    </section>

    <aside style="flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:14px">
      <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px">
        <h2 style="font-size:20px">Availability</h2>
        <label style="display:flex;justify-content:space-between;align-items:center"><span>Accept advance bookings</span><input type="checkbox" checked style="width:20px;height:20px"></label>
        <div style="display:flex;gap:10px"><div style="flex:1;display:flex;flex-direction:column;gap:4px"><label for="mn" style="font-size:13px;font-weight:600">Min notice</label><select id="mn" style="padding:9px;border-radius:8px;border:1px solid #CBD2DB;font:inherit"><option>2 hours</option></select></div><div style="flex:1;display:flex;flex-direction:column;gap:4px"><label for="mx" style="font-size:13px;font-weight:600">Book up to</label><select id="mx" style="padding:9px;border-radius:8px;border:1px solid #CBD2DB;font:inherit"><option>15 days ahead</option></select></div></div>
        <div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600">Blocked dates</span><div style="display:flex;gap:6px;flex-wrap:wrap"><span style="padding:6px 10px;border-radius:8px;background:#F4F6F9;font-size:14px">20 Oct ✕</span><span style="padding:6px 10px;border-radius:8px;background:#F4F6F9;font-size:14px">21 Oct ✕</span><a href="#" style="padding:6px 10px;font-size:14px;font-weight:600">+ Block date</a></div></div>
        <p style="font-size:13px;color:#5E6B7D">No weekly calendar needed. Your AVAILABLE / BUSY switch does the rest.</p>
      </div>
      <div style="background:#13213C;color:#FFFFFF;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px">
        <b style="color:#F4A51C;font-size:13px;letter-spacing:.06em">EXAMPLE · DRIVER RATE CARD</b>
        <div style="display:grid;grid-template-columns:1fr auto;gap:6px;font-size:15px;color:#E6EBF2">
          <span>Hourly</span><span>₹150 / hr</span><span>8 hours</span><span>₹1,000</span><span>Full day</span><span>₹1,200</span><span>2 days</span><span>₹2,200</span><span>Extra hour</span><span>₹150</span><span>Outstation</span><span>Quote</span>
        </div>
        <div style="border-top:1px solid #2E3D5C;padding-top:10px;font-size:15px">Client books 10 hours → <b style="color:#F4A51C">₹1,000 + 2 × ₹150 = ₹1,300</b></div>
      </div>
      <a href="WorkerDashboard.dc.html" style="padding:14px;border-radius:12px;background:#0B6E4F;color:#FFFFFF;text-decoration:none;font-weight:700;text-align:center">Save changes</a>
    </aside>
  </div>
</main>
</div>
</script>
