<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karvia · Compare quotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Hind',system-ui,sans-serif;color:#13213C;background:#F4F6F9}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.1}
p{margin:0}
a{color:#0B6E4F}a:hover{color:#08523B}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-tpl">
<div style="min-height:1200px;background:#F4F6F9">
<header style="background:#FFFFFF;border-bottom:1px solid #E3E6EB">
  <div style="max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px">
    <a href="ClientDashboard.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#13213C"><span style="width:34px;height:34px;border-radius:10px;background:#0B6E4F;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font:800 20px 'Baloo 2',sans-serif">K</span><span style="font:800 24px 'Baloo 2',sans-serif">karvia</span></a>
    <nav style="display:flex;flex-wrap:wrap;gap:4px;flex:1 1 480px;font-weight:500;font-size:15px">
      <a href="ClientDashboard.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">Home</a>
      <a href="FindWorkers.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">Find worker</a>
      <a href="RequestStatus.dc.html" style="padding:9px 12px;border-radius:9px;background:#E3F2EC;color:#0B6E4F;font-weight:700;text-decoration:none">My requests</a>
      <a href="MyBookings.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">My bookings</a>
      <a href="MyWorkers.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">My workers</a>
    </nav>
    <a href="Payments.dc.html" style="padding:7px 12px;border-radius:999px;background:#FFF3DC;color:#8A5A00;font-size:14px;font-weight:600;text-decoration:none">₹9 access · 22 days left</a>
  </div>
</header>

<main style="max-width:1240px;margin:0 auto;padding:28px 24px 56px;display:flex;flex-direction:column;gap:20px">
  <div><p style="color:#5E6B7D">Request #KRV-10511 · Painter · 2BHK interior painting · Quote request</p><h1 style="font-size:38px;font-weight:800">3 quotes received</h1></div>
  <div style="background:#FFF3DC;border-radius:14px;padding:14px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>Each quote is valid for 30 minutes.</b><span style="color:#3D4A5C">You can accept only one. Rejecting or ignoring a quote is free.</span></div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start">
    <sc-for list="{{quotes}}" as="q" hint-placeholder-count="3">
      <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#F4F6F9;color:#3D4A5C">{{q.ver}}</span><span style="font-size:13px;font-weight:700;color:#8A5A00">⏱ {{q.left}} left</span></div>
        <div style="display:flex;gap:12px;align-items:center"><span style="width:48px;height:48px;border-radius:50%;background:#DCE7F5;display:flex;align-items:center;justify-content:center;font-weight:700">{{q.ini}}</span><div><a href="WorkerProfile.dc.html" style="font-weight:700;color:#13213C;text-decoration:none;font-size:17px">{{q.name}}</a><p style="font-size:14px;color:#5E6B7D">★ {{q.rating}} · {{q.km}} · {{q.exp}}</p></div></div>
        <div style="display:grid;grid-template-columns:1fr auto;gap:8px;font-size:15px">
          <span>Service charge</span><span>{{q.service}}</span>
          <span>Material / extra</span><span>{{q.material}}</span>
          <span style="color:#5E6B7D">Tax (if configured)</span><span style="color:#5E6B7D">{{q.tax}}</span>
          <b style="border-top:1px solid #E3E6EB;padding-top:8px">Total</b><b style="border-top:1px solid #E3E6EB;padding-top:8px;font:800 22px 'Baloo 2',sans-serif">{{q.total}}</b>
        </div>
        <p style="font-size:14px;color:#3D4A5C;background:#F4F6F9;border-radius:10px;padding:10px">"{{q.note}}"</p>
        <div style="display:flex;gap:8px">
          <a href="BookingDetail.dc.html" style="flex:1;padding:13px;border-radius:12px;background:#0B6E4F;color:#FFFFFF;text-decoration:none;font-weight:700;text-align:center">Accept</a>
          <button style="flex:1;padding:13px;border-radius:12px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 15px Hind,sans-serif;color:#13213C;cursor:pointer">Reject</button>
        </div>
      </section>
    </sc-for>
  </div>
  <p style="font-size:14px;color:#5E6B7D">When a worker edits a quote it becomes a new version (v2) and the old one is kept in history. Once you accept, the amount is locked into the booking.</p>
</main>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    return { quotes: [
      { ver:'QUOTE v1', left:'24 min', ini:'DP', name:'Dinesh Pal', rating:'4.7', km:'2.0 KM', exp:'11 yrs', service:'₹9,500', material:'₹6,200', tax:'₹0', total:'₹15,700', note:'Asian Paints Tractor Emulsion, 2 coats, putty on damaged walls. 3 days.' },
      { ver:'QUOTE v2 · revised', left:'17 min', ini:'KS', name:'Kamal Saini', rating:'4.5', km:'3.4 KM', exp:'6 yrs', service:'₹8,800', material:'₹5,900', tax:'₹0', total:'₹14,700', note:'2 coats, 2 painters. Can start Monday. Material bill will be shared.' },
      { ver:'QUOTE v1', left:'29 min', ini:'RT', name:'Ravi Tomar', rating:'4.9', km:'4.6 KM', exp:'15 yrs', service:'₹11,000', material:'₹6,500', tax:'₹0', total:'₹17,500', note:'Includes furniture covering and cleanup. 2.5 days with a team of 3.' }
    ] };
  }
}
</script>
<a href="screens.html" style="position:fixed;right:16px;bottom:16px;z-index:999;padding:10px 14px;border-radius:999px;background:#13213C;color:#FFFFFF;font:600 14px Hind,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px -8px rgba(19,33,60,.5)">All screens</a>
<script src="support.js"></script>
</body>
</html>
