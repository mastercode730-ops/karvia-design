<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karvia · Worker registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Hind',system-ui,sans-serif;color:#13213C;background:#F4F6F9}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.1}
p{margin:0}
a{color:#0B6E4F}a:hover{color:#08523B}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-tpl">
<div style="min-height:1500px;background:#F4F6F9">
<header style="background:#13213C">
  <div style="max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
    <a href="Main.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#FFFFFF"><span style="width:34px;height:34px;border-radius:10px;background:#F4A51C;color:#13213C;display:flex;align-items:center;justify-content:center;font:800 20px 'Baloo 2',sans-serif">K</span><span style="font:800 24px 'Baloo 2',sans-serif">karvia</span><span style="font-size:13px;font-weight:600;padding:3px 8px;border-radius:6px;background:#22314F;color:#F4A51C">WORKER</span></a>
    <span style="color:#C3CCDA;font-size:14px">✓ Autosaved 2 seconds ago</span>
  </div>
</header>

<main style="max-width:1240px;margin:0 auto;padding:28px 24px 56px;display:flex;flex-direction:column;gap:18px">
  <div style="background:#FFF3DC;border-radius:14px;padding:14px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <b>Profile 45% complete.</b><span style="color:#3D4A5C">You can stop anytime and continue later. Clients can see you only after Karvia verifies your profile.</span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
    <aside style="flex:1 1 260px;max-width:300px;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:4px">
      <div style="height:8px;border-radius:4px;background:#E3E6EB;overflow:hidden;margin-bottom:12px"><div style="width:45%;height:100%;background:#0B6E4F"></div></div>
      <div style="display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px"><span style="width:26px;height:26px;border-radius:50%;background:#0B6E4F;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">✓</span><span>Mobile + OTP</span></div>
      <div style="display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px"><span style="width:26px;height:26px;border-radius:50%;background:#0B6E4F;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">✓</span><span>Name &amp; photo</span></div>
      <div style="display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:#E3F2EC"><span style="width:26px;height:26px;border-radius:50%;background:#FFFFFF;border:2px solid #0B6E4F;color:#0B6E4F;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">3</span><b style="color:#0B6E4F">Service &amp; location</b></div>
      <div style="display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;color:#5E6B7D"><span style="width:26px;height:26px;border-radius:50%;border:2px solid #CBD2DB;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">4</span><span>Experience &amp; skills</span></div>
      <div style="display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;color:#5E6B7D"><span style="width:26px;height:26px;border-radius:50%;border:2px solid #CBD2DB;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">5</span><span>Pricing &amp; availability</span></div>
      <div style="display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;color:#5E6B7D"><span style="width:26px;height:26px;border-radius:50%;border:2px solid #CBD2DB;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">6</span><span>Work history</span></div>
      <div style="display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;color:#5E6B7D"><span style="width:26px;height:26px;border-radius:50%;border:2px solid #CBD2DB;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">7</span><span>Documents</span></div>
      <div style="display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;color:#5E6B7D"><span style="width:26px;height:26px;border-radius:50%;border:2px solid #CBD2DB;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">8</span><span>Submit for verification</span></div>
    </aside>

    <form style="flex:999 1 600px;min-width:0;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:18px">
      <div><span style="font-size:13px;font-weight:600;color:#5E6B7D">STEP 3 OF 8</span><h1 style="font-size:34px;font-weight:800">What work do you do, and where?</h1></div>
      <div style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:600">Category</span>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px">
          <label style="display:flex;gap:8px;padding:12px;border:2px solid #0B6E4F;border-radius:10px;background:#E3F2EC;font-weight:600"><input type="radio" name="c" checked> Plumber</label>
          <label style="display:flex;gap:8px;padding:12px;border:1px solid #CBD2DB;border-radius:10px"><input type="radio" name="c"> Electrician</label>
          <label style="display:flex;gap:8px;padding:12px;border:1px solid #CBD2DB;border-radius:10px"><input type="radio" name="c"> Driver</label>
          <label style="display:flex;gap:8px;padding:12px;border:1px solid #CBD2DB;border-radius:10px"><input type="radio" name="c"> Maid</label>
          <label style="display:flex;gap:8px;padding:12px;border:1px solid #CBD2DB;border-radius:10px"><input type="radio" name="c"> Labour</label>
          <label style="display:flex;gap:8px;padding:12px;border:1px solid #CBD2DB;border-radius:10px"><input type="radio" name="c"> Painter</label>
          <label style="display:flex;gap:8px;padding:12px;border:1px solid #CBD2DB;border-radius:10px"><input type="radio" name="c"> DJ / Event</label>
          <label style="display:flex;gap:8px;padding:12px;border:1px solid #CBD2DB;border-radius:10px"><input type="radio" name="c"> Office staff</label>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:600">Services you offer</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <label style="display:flex;gap:6px;padding:9px 14px;border-radius:999px;background:#13213C;color:#FFFFFF"><input type="checkbox" checked> Tap / leak repair</label>
          <label style="display:flex;gap:6px;padding:9px 14px;border-radius:999px;background:#13213C;color:#FFFFFF"><input type="checkbox" checked> Bathroom fitting</label>
          <label style="display:flex;gap:6px;padding:9px 14px;border-radius:999px;border:1px solid #CBD2DB"><input type="checkbox"> Full pipeline work</label>
          <label style="display:flex;gap:6px;padding:9px 14px;border-radius:999px;border:1px solid #CBD2DB"><input type="checkbox"> Water tank cleaning</label>
          <label style="display:flex;gap:6px;padding:9px 14px;border-radius:999px;background:#13213C;color:#FFFFFF"><input type="checkbox" checked> Emergency visit</label>
        </div>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div style="flex:2 1 260px;display:flex;flex-direction:column;gap:6px"><label for="loc" style="font-weight:600">Your work area</label><input id="loc" value="Sector 63, Noida" style="padding:12px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"><span style="font-size:13px;color:#5E6B7D">Used only for matching. Never shown to clients.</span></div>
        <div style="flex:1 1 140px;display:flex;flex-direction:column;gap:6px"><label for="pin" style="font-weight:600">Pincode</label><input id="pin" value="201301" style="padding:12px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"></div>
      </div>
      <button type="button" style="align-self:flex-start;display:flex;gap:8px;align-items:center;padding:11px 14px;border-radius:10px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 14px Hind,sans-serif;color:#13213C;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#13213C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path></svg>Fill this by speaking</button>
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid #E3E6EB;padding-top:18px">
        <a href="WorkerDashboard.dc.html" style="padding:13px 18px;border-radius:12px;border:1px solid #CBD2DB;color:#13213C;text-decoration:none;font-weight:600">Save &amp; finish later</a>
        <div style="display:flex;gap:10px"><a href="#" style="padding:13px 18px;border-radius:12px;color:#13213C;text-decoration:none;font-weight:600">Back</a><a href="WorkerProfileEdit.dc.html" style="padding:13px 22px;border-radius:12px;background:#0B6E4F;color:#FFFFFF;text-decoration:none;font-weight:700">Save &amp; continue</a></div>
      </div>
    </form>
  </div>
  <div style="background:#FFFFFF;border:1px dashed #CBD2DB;border-radius:16px;padding:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <b>Returning worker state:</b><span style="color:#3D4A5C;flex:1 1 400px">After login, an incomplete worker lands on "Complete your profile · 45% done · Continue from Step 3", never on Step 1 again.</span>
  </div>
</main>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
<a href="screens.html" style="position:fixed;right:16px;bottom:16px;z-index:999;padding:10px 14px;border-radius:999px;background:#13213C;color:#FFFFFF;font:600 14px Hind,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px -8px rgba(19,33,60,.5)">All screens</a>
<script src="support.js"></script>
</body>
</html>
