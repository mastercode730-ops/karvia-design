<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karvia · Experience and work history</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Hind',system-ui,sans-serif;color:#13213C;background:#F4F6F9}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.1}
p{margin:0}
a{color:#0B6E4F}a:hover{color:#08523B}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-tpl">
<div style="min-height:1800px;background:#F4F6F9">
<header style="background:#13213C">
  <div style="max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px">
    <a href="WorkerDashboard.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#FFFFFF"><span style="width:34px;height:34px;border-radius:10px;background:#F4A51C;color:#13213C;display:flex;align-items:center;justify-content:center;font:800 20px 'Baloo 2',sans-serif">K</span><span style="font:800 24px 'Baloo 2',sans-serif">karvia</span><span style="font-size:13px;font-weight:600;padding:3px 8px;border-radius:6px;background:#22314F;color:#F4A51C">WORKER</span></a>
    <nav style="display:flex;flex-wrap:wrap;gap:4px;flex:1 1 520px;font-weight:500;font-size:15px">
      <a href="WorkerDashboard.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Dashboard</a>
      <a href="WorkerJobs.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Requests &amp; jobs</a>
      <a href="WorkerPricing.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Services &amp; pricing</a>
      <a href="WorkerProfileEdit.dc.html" style="padding:9px 12px;border-radius:9px;background:#22314F;color:#FFFFFF;font-weight:700;text-decoration:none">Profile</a>
      <a href="WorkerDocuments.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Documents</a>
      <a href="WorkerSubscription.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">My plan</a>
      <a href="WorkerReviews.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Reviews</a>
    </nav>
    <span style="color:#C3CCDA;font-size:14px">✓ Autosaved</span>
  </div>
</header>

<main style="max-width:1000px;margin:0 auto;padding:28px 24px 56px;display:flex;flex-direction:column;gap:16px">
  <h1 style="font-size:40px;font-weight:800">My professional profile</h1>
  <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-wrap:wrap;gap:20px;align-items:center">
    <div style="width:96px;height:96px;border-radius:50%;background:#DCE7F5;display:flex;align-items:center;justify-content:center;font:800 30px 'Baloo 2',sans-serif">RY</div>
    <div style="flex:1 1 300px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;gap:10px;flex-wrap:wrap"><div style="flex:1 1 200px;display:flex;flex-direction:column;gap:4px"><label for="nm" style="font-size:13px;font-weight:600">Full name</label><input id="nm" value="Rakesh Yadav" style="padding:11px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"></div><div style="flex:1 1 140px;display:flex;flex-direction:column;gap:4px"><label for="yr" style="font-size:13px;font-weight:600">Total experience</label><input id="yr" value="8 years" style="padding:11px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"></div></div>
      <a href="#" style="font-weight:600;font-size:14px">Change photo</a>
    </div>
  </section>

  <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px">
    <h2 style="font-size:22px">Skills, certifications &amp; languages</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><span style="padding:7px 12px;border-radius:999px;background:#F4F6F9">CPVC &amp; PVC fitting ✕</span><span style="padding:7px 12px;border-radius:999px;background:#F4F6F9">Leak detection ✕</span><span style="padding:7px 12px;border-radius:999px;background:#F4F6F9">Geyser installation ✕</span><span style="padding:7px 12px;border-radius:999px;border:1px dashed #CBD2DB">+ Add skill</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><span style="padding:7px 12px;border-radius:999px;background:#E8EEFC;color:#1D4ED8">ITI Plumbing (2015) ✕</span><span style="padding:7px 12px;border-radius:999px;border:1px dashed #CBD2DB">+ Add certificate</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><span style="padding:7px 12px;border-radius:999px;background:#FFF3DC;color:#8A5A00">Hindi ✕</span><span style="padding:7px 12px;border-radius:999px;background:#FFF3DC;color:#8A5A00">English (basic) ✕</span><span style="padding:7px 12px;border-radius:999px;border:1px dashed #CBD2DB">+ Language</span></div>
  </section>

  <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="font-size:22px">Employment / work history</h2><a href="#" style="font-weight:600">+ Add job</a></div>
    <div style="border:1px solid #E3E6EB;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div style="flex:1 1 220px;display:flex;flex-direction:column;gap:4px"><label for="co" style="font-size:13px;font-weight:600">Company / employer</label><input id="co" value="Shree Builders" style="padding:11px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"></div>
        <div style="flex:1 1 220px;display:flex;flex-direction:column;gap:4px"><label for="ti" style="font-size:13px;font-weight:600">Job title</label><input id="ti" value="Senior plumber" style="padding:11px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"></div>
        <div style="flex:1 1 120px;display:flex;flex-direction:column;gap:4px"><label for="st" style="font-size:13px;font-weight:600">From</label><input id="st" value="Apr 2019" style="padding:11px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"></div>
        <div style="flex:1 1 120px;display:flex;flex-direction:column;gap:4px"><label for="en" style="font-size:13px;font-weight:600">To</label><input id="en" value="Mar 2023" style="padding:11px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px"><label for="rs" style="font-size:13px;font-weight:600">Responsibilities</label><textarea id="rs" rows="2" style="padding:11px;border-radius:10px;border:1px solid #CBD2DB;font:inherit">Bathroom and kitchen fittings for residential towers. Led a team of 4.</textarea></div>
    </div>
    <div style="border:1px solid #E3E6EB;border-radius:14px;padding:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>Plumber · Self-employed</b><p style="font-size:14px;color:#5E6B7D">2016 – 2019 · Local repairs in Noida</p></div><a href="#" style="font-weight:600">Edit</a></div>
  </section>

  <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px">
    <h2 style="font-size:22px">For office staff &amp; employees</h2>
    <p style="font-size:14px;color:#5E6B7D">Shown only for categories that need it (set by admin).</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="flex:1 1 200px;display:flex;flex-direction:column;gap:4px"><label for="es" style="font-size:13px;font-weight:600">Expected salary / rate</label><input id="es" placeholder="₹ per month" style="padding:11px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"></div>
      <div style="flex:1 1 200px;display:flex;flex-direction:column;gap:4px"><label for="pl" style="font-size:13px;font-weight:600">Preferred work location</label><input id="pl" placeholder="e.g. Noida, Greater Noida" style="padding:11px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"></div>
      <div style="flex:1 1 200px;display:flex;flex-direction:column;gap:4px"><label for="jn" style="font-size:13px;font-weight:600">Can join</label><select id="jn" style="padding:11px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"><option>Immediately</option><option>In 15 days</option><option>In 30 days</option></select></div>
    </div>
    <div style="border:2px dashed #CBD2DB;border-radius:12px;padding:16px;text-align:center;color:#5E6B7D">Upload resume / biodata (PDF, up to 5 MB)</div>
  </section>

  <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:22px">Work photos</h2><a href="#" style="font-weight:600">+ Upload</a></div>
    <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px">
      <div style="aspect-ratio:1;max-width:100%;border-radius:10px;background:#E9EEF3"></div><div style="aspect-ratio:1;max-width:100%;border-radius:10px;background:#E9EEF3"></div><div style="aspect-ratio:1;max-width:100%;border-radius:10px;background:#E9EEF3"></div><div style="aspect-ratio:1;max-width:100%;border-radius:10px;background:#E9EEF3"></div><div style="aspect-ratio:1;max-width:100%;border-radius:10px;border:2px dashed #CBD2DB;display:flex;align-items:center;justify-content:center;color:#5E6B7D">+</div>
    </div>
  </section>
  <p style="font-size:14px;color:#5E6B7D">Changes to name, photo or category go back to admin review before they show to clients.</p>
</main>
</div>
</script>

<script src="support.js"></script>
</body>
</html>
