<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karvia Admin · Top performers & rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Hind',system-ui,sans-serif;color:#13213C;background:#F4F6F9}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.1}
p{margin:0}
a{color:#0B6E4F}a:hover{color:#08523B}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-tpl">
<div style="min-height:1500px;background:#F4F6F9;display:flex;flex-wrap:wrap">
<nav style="flex:1 1 230px;max-width:250px;background:#0E1830;padding:18px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px">
  <a href="AdminDashboard.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#FFFFFF;padding:4px 8px 16px"><span style="width:30px;height:30px;border-radius:8px;background:#0B6E4F;display:flex;align-items:center;justify-content:center;font:800 18px 'Baloo 2',sans-serif">K</span><span style="font:800 20px 'Baloo 2',sans-serif">karvia</span><span style="font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:#22314F;color:#8FD3BA">ADMIN</span></a>
  <a href="AdminDashboard.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Dashboard</a>
  <a href="AdminVerification.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Verification</a>
  <a href="AdminWorkerDetail.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Workers</a>
  <a href="AdminClients.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Clients</a>
  <a href="AdminBookings.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Requests &amp; bookings</a>
  <a href="AdminPayments.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Payments &amp; plans</a>
  <a href="AdminComplaints.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Complaints</a>
  <a href="AdminLeads.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Leads</a>
  <a href="TelecallerConsole.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Telecaller view</a>
  <a href="AdminRewards.dc.html" style="padding:9px 12px;border-radius:8px;background:#22314F;color:#FFFFFF;font-weight:700;text-decoration:none">Top performers</a>
  <a href="AdminMeetings.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Worker meetings</a>
  <span style="padding:14px 12px 4px;color:#7D8AA3;font-size:11px;font-weight:700;letter-spacing:.08em">CONFIGURATION</span>
  <a href="AdminCategories.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Categories</a>
  <a href="AdminMatching.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Matching rules</a>
  <a href="AdminSettings.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Business settings</a>
  <a href="AdminRoles.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Roles &amp; audit log</a>
</nav>

<main style="flex:999 1 560px;min-width:0;padding:24px 28px 48px;display:flex;flex-direction:column;gap:16px">
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between">
    <div><h1 style="font-size:32px;font-weight:800">Top performers &amp; rewards</h1><p style="color:#5E6B7D">Ranked automatically every month. Review, reward, then publish to the website’s Top workers page.</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <select aria-label="Period" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit;background:#FFFFFF"><option>October 2026 (month so far)</option><option>September 2026</option><option>Last 90 days</option></select>
      <select aria-label="City" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit;background:#FFFFFF"><option>Delhi NCR</option><option>Ambala</option><option>All cities</option></select>
      <select aria-label="Category" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit;background:#FFFFFF"><option>All categories</option><option>Plumber</option><option>Maid</option></select>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px">
    <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:16px"><span style="font-size:14px;color:#5E6B7D">Ranked workers</span><b style="display:block;font:800 28px 'Baloo 2',sans-serif">186</b></div>
    <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:16px"><span style="font-size:14px;color:#5E6B7D">Excluded (complaint / warning)</span><b style="display:block;font:800 28px 'Baloo 2',sans-serif;color:#A3261F">9</b></div>
    <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:16px"><span style="font-size:14px;color:#5E6B7D">Rewards given this month</span><b style="display:block;font:800 28px 'Baloo 2',sans-serif;color:#0B6E4F">{{rewardCount}}</b></div>
    <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:16px"><span style="font-size:14px;color:#5E6B7D">Website list</span><b style="display:block;font:800 22px 'Baloo 2',sans-serif;color:{{pubColor}}">{{pubLabel}}</b></div>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
    <section style="flex:999 1 560px;min-width:0;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:14px;min-width:720px">
        <thead><tr style="text-align:left;color:#5E6B7D;font-size:12px;letter-spacing:.06em">
          <th style="padding:12px">#</th><th style="padding:12px">WORKER</th><th style="padding:12px">SCORE</th><th style="padding:12px">RATING</th><th style="padding:12px">JOBS</th><th style="padding:12px">ON TIME</th><th style="padding:12px">REHIRED</th><th style="padding:12px">ON WEBSITE</th><th style="padding:12px">REWARD</th>
        </tr></thead>
        <tbody>
          <sc-for list="{{rows}}" as="r">
            <tr onClick="{{r.pick}}" style="{{r.row}}">
              <td style="padding:12px;font:800 18px 'Baloo 2',sans-serif">{{r.rank}}</td>
              <td style="padding:12px"><b>{{r.name}}</b><div style="color:#5E6B7D;font-size:13px">{{r.cat}} · {{r.area}}</div></td>
              <td style="padding:12px"><b>{{r.score}}</b></td>
              <td style="padding:12px">{{r.rating}} ★ <span style="color:#5E6B7D">({{r.reviews}})</span></td>
              <td style="padding:12px">{{r.jobs}}</td>
              <td style="padding:12px">{{r.ontime}}</td>
              <td style="padding:12px">{{r.rehire}}</td>
              <td style="padding:12px"><span style="{{r.webStyle}}">{{r.web}}</span></td>
              <td style="padding:12px"><span style="{{r.rewardStyle}}">{{r.reward}}</span></td>
            </tr>
          </sc-for>
        </tbody>
      </table>
      <div style="padding:12px 16px;border-top:1px solid #E3E6EB;font-size:13px;color:#5E6B7D">Click a worker to see the score and give a reward. Excluded this month: 9 workers with an open complaint or warning (not shown).</div>
    </section>

    <aside style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px">
      <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">{{sel.name}}</b><a href="AdminWorkerDetail.dc.html" style="font-size:14px;font-weight:600">Profile</a></div>
        <p style="font-size:14px;color:#5E6B7D">{{sel.cat}} · {{sel.area}} · Rank #{{sel.rank}}</p>
        <div style="display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;background:#F4F6F9;border-radius:10px;padding:12px">
          <span>Rating {{sel.rating}} × 40%</span><b>{{sel.p1}}</b>
          <span>Jobs {{sel.jobs}} × 25%</span><b>{{sel.p2}}</b>
          <span>On time {{sel.ontime}} × 20%</span><b>{{sel.p3}}</b>
          <span>Rehired {{sel.rehire}} × 15%</span><b>{{sel.p4}}</b>
          <span style="font-weight:700">Score</span><b>{{sel.score}} / 100</b>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:14px"><span>Agreed to appear on website</span><b style="color:#0B6E4F">Yes · 2 Oct</b></div>
        <button onClick="{{toggleWeb}}" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 14px Hind,sans-serif;color:#13213C;cursor:pointer">{{webBtn}}</button>
      </section>

      <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px">
        <b style="font-size:17px">Give a reward</b>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
          <sc-for list="{{types}}" as="t"><button onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for>
        </div>
        <label for="rv" style="font-size:13px;font-weight:600">{{valueLabel}}</label>
        <input id="rv" value="{{valueDefault}}" style="padding:9px;border-radius:9px;border:1px solid #CBD2DB;font:inherit">
        <label for="rn" style="font-size:13px;font-weight:600">Message to worker (SMS + in-app)</label>
        <textarea id="rn" rows="3" style="padding:9px;border-radius:9px;border:1px solid #CBD2DB;font:inherit">Badhai ho {{sel.first}}! You are a Karvia Star for October. Thank you for your great work.</textarea>
        <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" checked> Add “Karvia Star · Oct 2026” badge to profile</label>
        <button onClick="{{give}}" style="padding:12px;border-radius:10px;border:0;background:#0B6E4F;color:#FFFFFF;font:700 15px Hind,sans-serif;cursor:pointer">Give reward to {{sel.first}}</button>
        <sc-if value="{{justGave}}"><p style="font-size:14px;background:#E3F2EC;color:#0B6E4F;border-radius:9px;padding:10px;font-weight:600">{{justGave}}</p></sc-if>
        <p style="font-size:12px;color:#5E6B7D">Cash is paid to the worker’s UPI outside Karvia and recorded here. Free days are added to the plan automatically. Every reward is saved to the audit log.</p>
      </section>

      <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px">
        <b style="font-size:17px">Publish to website</b>
        <p style="font-size:14px;color:#3D4A5C">Top 10 per city that agreed to appear. Shows first name, last initial, service, area, rating and jobs only.</p>
        <button onClick="{{publish}}" style="padding:11px;border-radius:10px;border:0;background:#13213C;color:#FFFFFF;font:700 14px Hind,sans-serif;cursor:pointer">{{pubBtn}}</button>
        <a href="TopWorkers.dc.html" style="font-size:14px;font-weight:600">Preview Top workers page →</a>
      </section>

      <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px">
        <b style="font-size:17px">Ranking rules</b>
        <div style="display:grid;grid-template-columns:1fr 70px;gap:6px 10px;font-size:14px;align-items:center">
          <span>Rating weight</span><input aria-label="Rating weight" value="40%" style="padding:6px;border-radius:7px;border:1px solid #CBD2DB;font:inherit">
          <span>Jobs weight</span><input aria-label="Jobs weight" value="25%" style="padding:6px;border-radius:7px;border:1px solid #CBD2DB;font:inherit">
          <span>On-time weight</span><input aria-label="On-time weight" value="20%" style="padding:6px;border-radius:7px;border:1px solid #CBD2DB;font:inherit">
          <span>Rehire weight</span><input aria-label="Rehire weight" value="15%" style="padding:6px;border-radius:7px;border:1px solid #CBD2DB;font:inherit">
          <span>Minimum reviews (90 days)</span><input aria-label="Minimum reviews" value="20" style="padding:6px;border-radius:7px;border:1px solid #CBD2DB;font:inherit">
        </div>
        <p style="font-size:12px;color:#5E6B7D">Excluded automatically: open complaint, warning or suspension in the period, plan expired.</p>
      </section>
    </aside>
  </div>
</main>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 0, type: 'cash', rewards: { 3: 'Free 30 days' }, web: { 0: 1, 1: 1, 2: 1, 3: 1 }, published: false, justGave: '' }; }
  renderVals() {
    const R = [
      ['Rakesh Yadav', 'Plumber', 'Noida Sec 63', 4.9, 128, 212, 98, 41],
      ['Sunita Devi', 'Maid', 'Indirapuram', 4.9, 96, 180, 99, 52],
      ['Arjun Mehta', 'Electrician', 'Noida Sec 50', 4.8, 110, 164, 97, 33],
      ['Imran Khan', 'Driver', 'Sector 18', 4.8, 74, 151, 96, 38],
      ['Mohan Singh', 'Plumber', 'Sector 62', 4.7, 61, 140, 95, 27],
      ['Pooja Rawat', 'Maid', 'Vaishali', 4.7, 58, 133, 97, 30],
      ['Deepak Tiwari', 'Painter', 'Greater Noida', 4.7, 42, 66, 94, 21],
      ['Salim Ansari', 'Electrician', 'Laxmi Nagar', 4.6, 55, 120, 95, 19]
    ];
    const st = this.state;
    const rows = R.map((r, i) => {
      const p1 = (r[3] / 5 * 40), p2 = Math.min(r[5] / 220, 1) * 25, p3 = r[6] / 100 * 20, p4 = Math.min(r[7] / 55, 1) * 15;
      const reward = st.rewards[i];
      return {
        idx: i, name: r[0], first: r[0].split(' ')[0], cat: r[1], area: r[2], rating: r[3], reviews: r[4], jobs: r[5], ontime: r[6] + '%', rehire: r[7] + '%',
        p1: p1.toFixed(1), p2: p2.toFixed(1), p3: p3.toFixed(1), p4: p4.toFixed(1), score: (p1 + p2 + p3 + p4).toFixed(1),
        web: st.web[i] ? 'Shown' : 'Hidden',
        webStyle: 'font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;' + (st.web[i] ? 'background:#E3F2EC;color:#0B6E4F' : 'background:#EEF1F5;color:#5E6B7D'),
        reward: reward || '—',
        rewardStyle: reward ? 'font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#FFF3DC;color:#8A5A00' : 'color:#5E6B7D',
        row: 'cursor:pointer;border-top:1px solid #E3E6EB;' + (i === st.sel ? 'background:#F3FAF7;box-shadow:inset 3px 0 0 #0B6E4F' : ''),
        pick: () => this.setState({ sel: i, justGave: '' })
      };
    });
    rows.sort((a, b) => b.score - a.score).forEach((r, k) => { r.rank = k + 1; });
    const sel = rows.find(r => r.idx === st.sel);
    const T = { cash: ['Cash bonus', 'Amount (₹)', '1000'], days: ['Free plan days', 'Days added to plan', '30'], gift: ['Gift / voucher', 'Gift description', 'Tool kit worth ₹1,500'], badge: ['Badge only', 'Certificate text', 'Karvia Star · October 2026'] };
    const t = T[st.type];
    return {
      rows, sel,
      types: Object.keys(T).map(k => ({ label: T[k][0], pick: () => this.setState({ type: k }), style: 'padding:9px 6px;border-radius:9px;font:600 13px Hind,sans-serif;cursor:pointer;border:1px solid ' + (k === st.type ? '#0B6E4F;background:#E3F2EC;color:#0B6E4F' : '#CBD2DB;background:#FFFFFF;color:#13213C') })),
      valueLabel: t[1], valueDefault: t[2],
      give: () => {
        const label = st.type === 'cash' ? '₹1,000 cash' : st.type === 'days' ? 'Free 30 days' : st.type === 'gift' ? 'Gift' : 'Badge';
        this.setState({ rewards: Object.assign({}, st.rewards, { [st.sel]: label }), justGave: label + ' recorded for ' + sel.first + '. SMS and in-app message sent.' });
      },
      justGave: st.justGave,
      rewardCount: Object.keys(st.rewards).length,
      webBtn: st.web[st.sel] ? 'Hide from website' : 'Show on website',
      toggleWeb: () => this.setState({ web: Object.assign({}, st.web, { [st.sel]: st.web[st.sel] ? 0 : 1 }) }),
      pubBtn: st.published ? 'Published · Unpublish' : 'Publish October list',
      publish: () => this.setState({ published: !st.published }),
      pubLabel: st.published ? 'Published' : 'Draft', pubColor: st.published ? '#0B6E4F' : '#8A5A00'
    };
  }
}
</script>
<a href="screens.html" style="position:fixed;right:16px;bottom:16px;z-index:999;padding:10px 14px;border-radius:999px;background:#13213C;color:#FFFFFF;font:600 14px Hind,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px -8px rgba(19,33,60,.5)">All screens</a>
<script src="support.js"></script>
</body>
</html>
