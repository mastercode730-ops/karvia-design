<div style="min-height:1200px;background:#F4F6F9">
<header style="background:#13213C">
  <div style="max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px">
    <a href="WorkerDashboard.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#FFFFFF"><span style="width:34px;height:34px;border-radius:10px;background:#F4A51C;color:#13213C;display:flex;align-items:center;justify-content:center;font:800 20px 'Baloo 2',sans-serif">K</span><span style="font:800 24px 'Baloo 2',sans-serif">karvia</span><span style="font-size:13px;font-weight:600;padding:3px 8px;border-radius:6px;background:#22314F;color:#F4A51C">WORKER</span></a>
    <nav style="display:flex;flex-wrap:wrap;gap:4px;flex:1 1 520px;font-weight:500;font-size:15px">
      <a href="WorkerDashboard.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Dashboard</a>
      <a href="WorkerJobs.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Requests &amp; jobs</a>
      <a href="WorkerPricing.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Services &amp; pricing</a>
      <a href="WorkerProfileEdit.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Profile</a>
      <a href="WorkerDocuments.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Documents</a>
      <a href="WorkerSubscription.dc.html" style="padding:9px 12px;border-radius:9px;background:#22314F;color:#FFFFFF;font-weight:700;text-decoration:none">My plan</a>
      <a href="WorkerReviews.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Reviews</a>
      <a href="WorkerMeetings.dc.html" style="padding:9px 12px;border-radius:9px;color:#C3CCDA;text-decoration:none">Meetings</a>
    </nav>
  </div>
</header>

<main style="max-width:1100px;margin:0 auto;padding:28px 24px 56px;display:flex;flex-direction:column;gap:18px">
  <h1 style="font-size:40px;font-weight:800">My plan</h1>
  <div style="display:flex;flex-wrap:wrap;gap:16px">
    <section style="flex:1 1 420px;min-width:0;background:#FFFFFF;border:2px solid #F4A51C;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="font-size:24px">Free trial</h2><span style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#FFF3DC;color:#8A5A00">ACTIVE · 3 DAYS LEFT</span></div>
      <div style="display:flex;gap:28px;flex-wrap:wrap"><div><span style="font-size:13px;color:#5E6B7D">Started</span><b style="display:block">7 Oct 2026</b></div><div><span style="font-size:13px;color:#5E6B7D">Ends</span><b style="display:block">12 Oct 2026</b></div><div><span style="font-size:13px;color:#5E6B7D">Length</span><b style="display:block">5 days</b></div></div>
      <div style="height:8px;border-radius:4px;background:#E3E6EB;overflow:hidden"><div style="width:40%;height:100%;background:#F4A51C"></div></div>
      <p style="font-size:14px;color:#5E6B7D">When the trial ends you stop getting new requests. Nothing is charged automatically.</p>
    </section>
    <section style="flex:1 1 420px;min-width:0;background:#13213C;color:#FFFFFF;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px">
      <span style="color:#F4A51C;font-weight:700;font-size:13px;letter-spacing:.06em">KARVIA PRO</span>
      <b style="font:800 48px 'Baloo 2',sans-serif;line-height:1">₹199 <span style="font:500 18px Hind,sans-serif;color:#C3CCDA">/ 30 days</span></b>
      <ul style="margin:0;padding-left:18px;line-height:1.7;color:#E6EBF2"><li>Requests from your area and category</li><li>No commission on jobs</li><li>Manual renewal only</li></ul>
      <div style="display:grid;grid-template-columns:1fr auto;gap:6px;font-size:14px;color:#C3CCDA;border-top:1px solid #2E3D5C;padding-top:10px"><span>Plan</span><span>₹199.00</span><span>Tax (if configured)</span><span>[₹0.00]</span><b style="color:#FFFFFF">Total</b><b style="color:#FFFFFF">₹199.00</b></div>
      <button style="padding:14px;border-radius:12px;border:0;background:#F4A51C;color:#13213C;font:800 17px Hind,sans-serif;cursor:pointer">Pay ₹199 with UPI</button>
    </section>
  </div>

  <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px">
    <h2 style="font-size:22px">Plan states</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">
      <div style="border:1px solid #E3E6EB;border-radius:12px;padding:14px"><b>Trial active</b><p style="font-size:14px;color:#5E6B7D">Gets requests. Reminder 2 days and 1 day before end.</p></div>
      <div style="border:1px solid #E3E6EB;border-radius:12px;padding:14px"><b>Paid active</b><p style="font-size:14px;color:#5E6B7D">Gets requests for 30 days. Reminder before expiry.</p></div>
      <div style="border:1px solid #E3E6EB;border-radius:12px;padding:14px"><b>Expired</b><p style="font-size:14px;color:#5E6B7D">Can log in, edit, see history. No new requests.</p></div>
      <div style="border:1px solid #E3E6EB;border-radius:12px;padding:14px"><b>Extended by admin</b><p style="font-size:14px;color:#5E6B7D">Shows new end date and "Extended by Karvia".</p></div>
    </div>
  </section>

  <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;overflow-x:auto">
    <div style="padding:18px 20px 6px"><h2 style="font-size:22px">Payment history</h2></div>
    <table style="width:100%;border-collapse:collapse;min-width:600px;font-size:15px">
      <thead><tr style="text-align:left;color:#5E6B7D;font-size:13px;text-transform:uppercase;letter-spacing:.05em"><th style="padding:12px 20px;border-bottom:1px solid #E3E6EB">Date</th><th style="padding:12px 20px;border-bottom:1px solid #E3E6EB">Item</th><th style="padding:12px 20px;border-bottom:1px solid #E3E6EB">Amount</th><th style="padding:12px 20px;border-bottom:1px solid #E3E6EB">Status</th><th style="padding:12px 20px;border-bottom:1px solid #E3E6EB"></th></tr></thead>
      <tbody><tr><td style="padding:14px 20px">7 Oct 2026</td><td style="padding:14px 20px">Free trial · 5 days</td><td style="padding:14px 20px">₹0</td><td style="padding:14px 20px"><span style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#E3F2EC;color:#0B6E4F">ACTIVE</span></td><td style="padding:14px 20px;color:#5E6B7D">—</td></tr></tbody>
    </table>
  </section>
</main>
