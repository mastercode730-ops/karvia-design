    <div id="t1" style="display:flex;flex-direction:column;gap:8px"><h2 style="font-size:24px">1. Who we are</h2><p>Karvia.services is a marketplace that connects clients with independent local workers. Workers are not Karvia employees.</p></div>

    <div id="t3" style="display:flex;flex-direction:column;gap:8px"><h2 style="font-size:24px">3. Worker plans</h2><p>Approved workers get one free trial. The paid plan is ₹199 for 30 days. Neither charges automatically.</p></div>
