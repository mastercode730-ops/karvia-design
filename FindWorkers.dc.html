<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karvia · Find workers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Hind',system-ui,sans-serif;color:#13213C;background:#F4F6F9}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.1}
p{margin:0}
a{color:#0B6E4F}a:hover{color:#08523B}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-tpl">
<div style="min-height:1600px;background:#F4F6F9">
<header style="background:#FFFFFF;border-bottom:1px solid #E3E6EB">
  <div style="max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px">
    <a href="ClientDashboard.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#13213C"><span style="width:34px;height:34px;border-radius:10px;background:#0B6E4F;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font:800 20px 'Baloo 2',sans-serif">K</span><span style="font:800 24px 'Baloo 2',sans-serif">karvia</span></a>
    <nav style="display:flex;flex-wrap:wrap;gap:4px;flex:1 1 480px;font-weight:500;font-size:15px">
      <a href="ClientDashboard.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">Home</a>
      <a href="FindWorkers.dc.html" style="padding:9px 12px;border-radius:9px;background:#E3F2EC;color:#0B6E4F;font-weight:700;text-decoration:none">Find worker</a>
      <a href="RequestStatus.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">My requests</a>
      <a href="MyBookings.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">My bookings</a>
      <a href="MyWorkers.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">My workers</a>
    </nav>
    <div style="display:flex;gap:10px;align-items:center">
      <a href="Payments.dc.html" style="padding:7px 12px;border-radius:999px;background:#FFF3DC;color:#8A5A00;font-size:14px;font-weight:600;text-decoration:none">₹9 access · 22 days left</a>
      <a href="Notifications.dc.html" aria-label="Notifications" style="width:42px;height:42px;border-radius:10px;border:1px solid #E3E6EB;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#13213C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg></a>
      <a href="ClientProfile.dc.html" aria-label="Profile" style="width:42px;height:42px;border-radius:50%;background:#13213C;color:#FFFFFF;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:700">PS</a>
    </div>
  </div>
</header>

<main style="max-width:1240px;margin:0 auto;padding:24px 24px 56px;display:flex;flex-direction:column;gap:18px">
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
    <div style="flex:1 1 300px;display:flex;gap:6px;align-items:center;font-size:15px;color:#5E6B7D"><a href="Categories.dc.html">Home repair</a> › <a href="Categories.dc.html">Plumber</a> › <b style="color:#13213C">Tap / leak repair</b></div>
    <span style="padding:9px 14px;border-radius:10px;background:#FFFFFF;border:1px solid #E3E6EB;font-weight:600">Job location: Home · Sector 62, Noida ▾</span>
    <a href="LocationChange.dc.html" style="padding:9px 14px;border-radius:10px;border:1px solid #0B6E4F;color:#0B6E4F;text-decoration:none;font-weight:600">📍 Use current location</a>
    <a href="NewRequest.dc.html" style="padding:10px 16px;border-radius:10px;background:#0B6E4F;color:#FFFFFF;text-decoration:none;font-weight:600">Send request to all nearby</a>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
    <aside style="flex:1 1 240px;max-width:280px;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:16px">
      <b style="font:700 18px 'Baloo 2',sans-serif">Filters</b>
      <div style="display:flex;flex-direction:column;gap:6px"><label for="rad" style="font-weight:600;font-size:14px">Distance</label><select id="rad" style="padding:10px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"><option>Within 5 KM</option><option>10 KM</option><option>15 KM</option></select></div>
      <div style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:600;font-size:14px">Booking type</span>
        <label style="display:flex;gap:8px"><input type="checkbox" checked> Instant</label>
        <label style="display:flex;gap:8px"><input type="checkbox" checked> Scheduled</label>
        <label style="display:flex;gap:8px"><input type="checkbox"> Quote</label></div>
      <div style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:600;font-size:14px">Price model</span>
        <label style="display:flex;gap:8px"><input type="checkbox" checked> Per visit</label>
        <label style="display:flex;gap:8px"><input type="checkbox"> Per hour</label>
        <label style="display:flex;gap:8px"><input type="checkbox"> Per job</label></div>
      <div style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:600;font-size:14px">Rating</span>
        <label style="display:flex;gap:8px"><input type="radio" name="r"> 4.5 ★ and above</label>
        <label style="display:flex;gap:8px"><input type="radio" name="r" checked> Any</label></div>
      <label style="display:flex;gap:8px;font-weight:600;font-size:14px"><input type="checkbox" checked> Available now only</label>
      <div style="display:flex;flex-direction:column;gap:6px"><label for="srt" style="font-weight:600;font-size:14px">Sort by</label><select id="srt" style="padding:10px;border-radius:10px;border:1px solid #CBD2DB;font:inherit"><option>Nearest first</option><option>Rating</option><option>Price: low to high</option><option>Most jobs done</option></select></div>
    </aside>

    <section style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:12px">
      <p style="color:#5E6B7D"><b style="color:#13213C">6 verified plumbers</b> available within 5 KM of your job</p>
      <sc-for list="{{workers}}" as="w" hint-placeholder-count="5">
        <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:16px;padding:18px;display:flex;flex-wrap:wrap;gap:16px;align-items:center">
          <div style="width:64px;height:64px;border-radius:50%;background:#DCE7F5;display:flex;align-items:center;justify-content:center;font:700 20px 'Baloo 2',sans-serif;flex:none">{{w.ini}}</div>
          <div style="flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:4px">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><a href="WorkerProfile.dc.html" style="font:700 20px 'Baloo 2',sans-serif;color:#13213C;text-decoration:none">{{w.name}}</a><span style="font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:#E3F2EC;color:#0B6E4F">✓ VERIFIED</span><span style="font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:#F4F6F9;color:#3D4A5C">{{w.avail}}</span></div>
            <p style="font-size:14px;color:#5E6B7D">{{w.exp}} · {{w.jobs}} jobs done · {{w.km}} away · Speaks {{w.lang}}</p>
            <p style="font-size:14px;color:#3D4A5C">{{w.skills}}</p>
          </div>
          <div style="flex:0 0 auto;display:flex;flex-direction:column;gap:2px;align-items:flex-end;min-width:120px">
            <b style="font:800 22px 'Baloo 2',sans-serif">{{w.price}}</b>
            <span style="font-size:13px;color:#5E6B7D">{{w.unit}}</span>
            <span style="font-size:14px;font-weight:600">★ {{w.rating}} <span style="color:#5E6B7D;font-weight:400">({{w.reviews}})</span></span>
          </div>
          <div style="flex:1 1 100%;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid #E3E6EB;padding-top:12px">
            <button style="padding:10px 14px;border-radius:10px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 14px Hind,sans-serif;color:#13213C;cursor:pointer">♡ Favourite</button>
            <a href="WorkerProfile.dc.html" style="padding:10px 14px;border-radius:10px;border:1px solid #CBD2DB;color:#13213C;text-decoration:none;font-weight:600;font-size:14px">View profile</a>
            <a href="NewRequest.dc.html" style="padding:10px 14px;border-radius:10px;background:#0B6E4F;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:14px">Request this worker</a>
          </div>
        </div>
      </sc-for>
      <div style="background:#FFFFFF;border:1px dashed #CBD2DB;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start">
        <b>Empty state (no one within 5 KM)</b>
        <p style="color:#5E6B7D">No verified plumber is free within 5 KM right now. We can search up to 10 KM, or send your request and notify you when someone accepts.</p>
        <div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap"><button style="padding:10px 14px;border-radius:10px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 14px Hind,sans-serif;cursor:pointer;color:#13213C">Search 10 KM</button><a href="NewRequest.dc.html" style="padding:10px 14px;border-radius:10px;background:#13213C;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:14px">Send request anyway</a></div>
      </div>
    </section>
  </div>
</main>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1600}}'>

    return { workers: [

      { ini:'MS', name:'Mohan Singh', avail:'AVAILABLE NOW', exp:'12 yrs exp', jobs:'102', km:'2.4 KM', lang:'Hindi, Punjabi', skills:'Leak repair · Water tank · Motor fitting', price:'₹350', unit:'per visit', rating:'4.7', reviews:'77' },
      { ini:'AK', name:'Anil Kumar', avail:'FROM 2 PM', exp:'5 yrs exp', jobs:'23', km:'3.1 KM', lang:'Hindi', skills:'Tap repair · Geyser fitting', price:'₹250', unit:'per hour', rating:'4.6', reviews:'15' },
      { ini:'SR', name:'Suresh Rawat', avail:'AVAILABLE NOW', exp:'3 yrs exp', jobs:'9', km:'4.0 KM', lang:'Hindi, Garhwali', skills:'Leak repair · Kitchen sink', price:'₹200', unit:'per visit', rating:'New', reviews:'0' },
      { ini:'FA', name:'Farhan Ali', avail:'TOMORROW', exp:'10 yrs exp', jobs:'88', km:'4.7 KM', lang:'Hindi, Urdu', skills:'Full pipeline work · Emergency visits', price:'Quote', unit:'for large jobs', rating:'4.9', reviews:'60' }

  }
}
</script>
<a href="screens.html" style="position:fixed;right:16px;bottom:16px;z-index:999;padding:10px 14px;border-radius:999px;background:#13213C;color:#FFFFFF;font:600 14px Hind,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px -8px rgba(19,33,60,.5)">All screens</a>
<script src="support.js"></script>
</body>
</html>
