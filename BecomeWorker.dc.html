<body>

<script type="text/x-dc-template" id="dc-tpl">
<div style="background:#FFFFFF">
<header style="border-bottom:1px solid #E3E6EB">
  <div style="max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 32px">
    <a href="Main.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#13213C"><span style="width:36px;height:36px;border-radius:10px;background:#0B6E4F;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font:800 22px 'Baloo 2',sans-serif">K</span><span style="font:800 26px 'Baloo 2',sans-serif">karvia</span></a>
    <nav style="display:flex;flex-wrap:wrap;gap:4px 22px;flex:1 1 360px;font-weight:500">
      <a href="HowItWorks.dc.html" style="color:#13213C;text-decoration:none;padding:10px 0">How Karvia works</a>
      <a href="Categories.dc.html" style="color:#13213C;text-decoration:none;padding:10px 0">Categories</a>
      <a href="BecomeWorker.dc.html" style="color:#0B6E4F;text-decoration:none;padding:10px 0;font-weight:700;border-bottom:2px solid #0B6E4F">Become a worker</a>
      <a href="TopWorkers.dc.html" style="color:#13213C;text-decoration:none;padding:10px 0">Top workers</a>
      <a href="Help.dc.html" style="color:#13213C;text-decoration:none;padding:10px 0">Help</a>
    </nav>
    <div style="display:flex;gap:10px"><a href="Login.dc.html" style="padding:11px 18px;border-radius:10px;border:1px solid #CBD2DB;color:#13213C;text-decoration:none;font-weight:600">Login</a><a href="WorkerRegister.dc.html" style="padding:11px 18px;border-radius:10px;background:#13213C;color:#FFFFFF;text-decoration:none;font-weight:600">Register as worker</a></div>
  </div>
</header>

<section style="background:#FFF3DC">
  <div style="max-width:1200px;margin:0 auto;padding:64px 24px;display:flex;flex-wrap:wrap;gap:40px;align-items:center">
    <div style="flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:18px">
      <span style="font-weight:700;color:#8A5A00;letter-spacing:.08em;text-transform:uppercase;font-size:13px">Kaam pao · For workers</span>
      <h1 style="font-size:58px;font-weight:800">Get work from clients in your own area.</h1>
      <p style="font-size:19px;color:#3D4A5C;line-height:1.5;max-width:54ch">Plumbers, electricians, drivers, maids, labourers, painters, DJs, office staff. Register in 2 minutes with your mobile. You can finish your profile later; nothing you enter is lost.</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <a href="WorkerRegister.dc.html" style="padding:16px 26px;border-radius:12px;background:#13213C;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:18px">Start registration</a>
        <a href="#plans" style="padding:16px 22px;border-radius:12px;border:1px solid #D9B66A;color:#13213C;text-decoration:none;font-weight:600;font-size:18px">See plans</a>
      </div>
    </div>
    <div style="flex:1 1 360px;min-width:0;background:#FFFFFF;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px;border:1px solid #F0DDB4">
      <b style="font:700 20px 'Baloo 2',sans-serif">You receive a request when:</b>
      <div style="display:flex;gap:10px;align-items:center"><span style="width:26px;height:26px;border-radius:50%;background:#E3F2EC;color:#0B6E4F;display:flex;align-items:center;justify-content:center;font-weight:700">✓</span>Karvia has verified you</div>
      <div style="display:flex;gap:10px;align-items:center"><span style="width:26px;height:26px;border-radius:50%;background:#E3F2EC;color:#0B6E4F;display:flex;align-items:center;justify-content:center;font-weight:700">✓</span>Your trial or plan is active</div>
      <div style="display:flex;gap:10px;align-items:center"><span style="width:26px;height:26px;border-radius:50%;background:#E3F2EC;color:#0B6E4F;display:flex;align-items:center;justify-content:center;font-weight:700">✓</span>You are switched to AVAILABLE</div>
      <div style="display:flex;gap:10px;align-items:center"><span style="width:26px;height:26px;border-radius:50%;background:#E3F2EC;color:#0B6E4F;display:flex;align-items:center;justify-content:center;font-weight:700">✓</span>The job matches your service</div>
      <div style="display:flex;gap:10px;align-items:center"><span style="width:26px;height:26px;border-radius:50%;background:#E3F2EC;color:#0B6E4F;display:flex;align-items:center;justify-content:center;font-weight:700">✓</span>The job is within 5 KM of you</div>
      <div style="display:flex;gap:10px;align-items:center"><span style="width:26px;height:26px;border-radius:50%;background:#E3F2EC;color:#0B6E4F;display:flex;align-items:center;justify-content:center;font-weight:700">✓</span>You are free at that date and time</div>
    </div>
  </div>
</section>

<section id="plans">
  <div style="max-width:1200px;margin:0 auto;padding:64px 24px;display:flex;flex-direction:column;gap:24px">
    <h2 style="font-size:38px">Plans</h2>
    <div style="display:flex;flex-wrap:wrap;gap:16px">
      <div style="flex:1 1 320px;border:1px solid #E3E6EB;border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:12px">
        <span style="font-weight:600;color:#5E6B7D">After approval</span>
        <h3 style="font-size:30px">Free trial</h3>
        <p style="font:800 44px 'Baloo 2',sans-serif">₹0 <span style="font:500 18px Hind,sans-serif;color:#5E6B7D">for 5 days</span></p>
        <ul style="margin:0;padding-left:20px;line-height:1.7;color:#3D4A5C"><li>One trial per mobile number</li><li>Reminder before it ends</li><li>Does not turn into a paid plan by itself</li></ul>
      </div>
      <div style="flex:1 1 320px;border:2px solid #0B6E4F;border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:12px;position:relative">
        <span style="position:absolute;top:-13px;left:24px;background:#0B6E4F;color:#FFFFFF;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px">Monthly</span>
        <span style="font-weight:600;color:#5E6B7D">Worker plan</span>
        <h3 style="font-size:30px">Karvia Pro</h3>
        <p style="font:800 44px 'Baloo 2',sans-serif">₹199 <span style="font:500 18px Hind,sans-serif;color:#5E6B7D">/ 30 days</span></p>
        <ul style="margin:0;padding-left:20px;line-height:1.7;color:#3D4A5C"><li>Unlimited matching requests</li><li>No commission on your jobs</li><li>You renew yourself. No auto-charge.</li><li>History stays even after expiry</li></ul>
        <a href="WorkerRegister.dc.html" style="margin-top:6px;padding:14px;border-radius:12px;background:#0B6E4F;color:#FFFFFF;text-decoration:none;font-weight:600;text-align:center">Register now</a>
      </div>
    </div>
  </div>
</section>

<section style="background:#F4F6F9">
  <div style="max-width:1200px;margin:0 auto;padding:64px 24px;display:flex;flex-direction:column;gap:24px">
    <h2 style="font-size:38px">Your path to the first job</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px">
      <div style="background:#FFFFFF;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px"><span style="font:800 28px 'Baloo 2',sans-serif;color:#0B6E4F">1</span><b>Mobile + OTP</b><p style="font-size:14px;color:#5E6B7D">No password</p></div>
      <div style="background:#FFFFFF;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px"><span style="font:800 28px 'Baloo 2',sans-serif;color:#0B6E4F">2</span><b>Basic profile</b><p style="font-size:14px;color:#5E6B7D">Name, photo, service, area, experience</p></div>
      <div style="background:#FFFFFF;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px"><span style="font:800 28px 'Baloo 2',sans-serif;color:#0B6E4F">3</span><b>Price &amp; skills</b><p style="font-size:14px;color:#5E6B7D">Per visit, hour, day or job</p></div>
      <div style="background:#FFFFFF;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px"><span style="font:800 28px 'Baloo 2',sans-serif;color:#0B6E4F">4</span><b>Documents</b><p style="font-size:14px;color:#5E6B7D">Private, never shown publicly</p></div>
      <div style="background:#FFFFFF;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px"><span style="font:800 28px 'Baloo 2',sans-serif;color:#0B6E4F">5</span><b>Verification</b><p style="font-size:14px;color:#5E6B7D">Karvia team reviews</p></div>
      <div style="background:#FFFFFF;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px"><span style="font:800 28px 'Baloo 2',sans-serif;color:#0B6E4F">6</span><b>Go AVAILABLE</b><p style="font-size:14px;color:#5E6B7D">Requests start coming</p></div>
    </div>
    <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;gap:14px;flex-wrap:wrap;align-items:center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B6E4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>
      <p style="flex:1 1 320px;line-height:1.5">Stuck halfway? Our team will call you and help finish your profile. You can also register by voice.</p>
    </div>
  </div>
</section>

<section>
  <div style="max-width:1200px;margin:0 auto;padding:64px 24px;display:flex;flex-direction:column;gap:16px">
    <h2 style="font-size:38px">Questions workers ask</h2>
    <details style="border:1px solid #E3E6EB;border-radius:12px;padding:16px 18px" open><summary style="font-weight:600;font-size:18px;cursor:pointer">Does Karvia take a cut from my job?</summary><p style="margin-top:8px;color:#3D4A5C;line-height:1.55">No. In Phase 1 the client pays you directly. You only pay the ₹199 monthly plan after your free trial.</p></details>
    <details style="border:1px solid #E3E6EB;border-radius:12px;padding:16px 18px"><summary style="font-weight:600;font-size:18px;cursor:pointer">What if my plan expires?</summary><p style="margin-top:8px;color:#3D4A5C;line-height:1.55">You can still log in, edit your profile and see past jobs. New requests stop until you renew.</p></details>
    <details style="border:1px solid #E3E6EB;border-radius:12px;padding:16px 18px"><summary style="font-weight:600;font-size:18px;cursor:pointer">Will clients see my home address?</summary><p style="margin-top:8px;color:#3D4A5C;line-height:1.55">Never. Matching uses the job location. Your address and documents stay private.</p></details>
    <details style="border:1px solid #E3E6EB;border-radius:12px;padding:16px 18px"><summary style="font-weight:600;font-size:18px;cursor:pointer">Do I need to fill a weekly calendar?</summary><p style="margin-top:8px;color:#3D4A5C;line-height:1.55">No. One switch: AVAILABLE or BUSY. You can block specific dates later if you want.</p></details>
  </div>
</section>
</div>
</script>
