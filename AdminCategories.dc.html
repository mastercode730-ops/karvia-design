<main style="flex:999 1 560px;min-width:0;padding:24px 28px 48px;display:flex;flex-direction:column;gap:16px">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap"><div><h1 style="font-size:34px;font-weight:800">Categories</h1><p style="color:#5E6B7D">Category → Sub-category → Service → Booking type → Pricing model</p></div><button style="padding:10px 14px;border-radius:9px;border:0;background:#0B6E4F;color:#FFFFFF;font:600 14px Hind,sans-serif;cursor:pointer">+ Add category</button></div>
  <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
    <section style="flex:1 1 280px;max-width:340px;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px;font-size:14px">
      <div style="padding:8px 10px;font-weight:700">▾ Home repair</div>
      <div style="padding:6px 10px 6px 26px;font-weight:600">▾ Plumber</div>
      <div style="padding:6px 10px 6px 44px;border-radius:8px;background:#E3F2EC;color:#0B6E4F;font-weight:700">Tap / leak repair</div>
      <div style="padding:6px 10px 6px 44px">Bathroom fitting</div>
      <div style="padding:6px 10px 6px 44px">Full pipeline work</div>
      <div style="padding:6px 10px 6px 44px">Emergency visit</div>
      <div style="padding:6px 10px 6px 26px">▸ Electrician</div>
      <div style="padding:6px 10px 6px 26px">▸ Carpenter</div>
      <div style="padding:8px 10px;font-weight:700">▸ Driving &amp; transport</div>
      <div style="padding:8px 10px;font-weight:700">▸ Home help</div>
      <div style="padding:8px 10px;font-weight:700">▸ Construction &amp; labour</div>
      <div style="padding:8px 10px;font-weight:700">▸ Events &amp; media</div>
      <div style="padding:8px 10px;font-weight:700">▸ Office staff</div>
      <div style="padding:8px 10px;font-weight:700;color:#5E6B7D">▸ Pest control <span style="font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:#F4F6F9">INACTIVE</span></div>
      <p style="font-size:12px;color:#5E6B7D;padding:8px 10px">Drag to reorder. Existing categories were audited and kept.</p>
    </section>

    <section style="flex:999 1 480px;min-width:0;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="font-size:24px">Tap / leak repair</h2><label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" checked style="width:18px;height:18px"> Active</label></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div style="flex:1 1 220px;display:flex;flex-direction:column;gap:4px"><label for="sn" style="font-size:13px;font-weight:600">Service name</label><input id="sn" value="Tap / leak repair" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
        <div style="flex:1 1 220px;display:flex;flex-direction:column;gap:4px"><label for="hn" style="font-size:13px;font-weight:600">Hindi name</label><input id="hn" value="नल / लीकेज मरम्मत" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600">Allowed booking types</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><label style="display:flex;gap:6px;padding:8px 12px;border-radius:999px;background:#13213C;color:#FFFFFF"><input type="checkbox" checked> Instant</label><label style="display:flex;gap:6px;padding:8px 12px;border-radius:999px;background:#13213C;color:#FFFFFF"><input type="checkbox" checked> Scheduled</label><label style="display:flex;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid #CBD2DB"><input type="checkbox"> Request quote</label></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600">Allowed pricing models</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <label style="display:flex;gap:6px;padding:8px 12px;border-radius:999px;background:#13213C;color:#FFFFFF"><input type="checkbox" checked> Per visit</label>
          <label style="display:flex;gap:6px;padding:8px 12px;border-radius:999px;background:#13213C;color:#FFFFFF"><input type="checkbox" checked> Per hour</label>
          <label style="display:flex;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid #CBD2DB"><input type="checkbox"> Per day</label>
          <label style="display:flex;gap:6px;padding:8px 12px;border-radius:999px;background:#13213C;color:#FFFFFF"><input type="checkbox" checked> Per job</label>
          <label style="display:flex;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid #CBD2DB"><input type="checkbox"> Per KM</label>
          <label style="display:flex;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid #CBD2DB"><input type="checkbox"> Per person</label>
          <label style="display:flex;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid #CBD2DB"><input type="checkbox"> Per item</label>
          <label style="display:flex;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid #CBD2DB"><input type="checkbox"> Package</label>
          <label style="display:flex;gap:6px;padding:8px 12px;border-radius:999px;background:#13213C;color:#FFFFFF"><input type="checkbox" checked> Custom quote</label>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">
        <div style="display:flex;flex-direction:column;gap:4px"><label for="du" style="font-size:13px;font-weight:600">Typical duration</label><input id="du" value="60 min" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
        <div style="display:flex;flex-direction:column;gap:4px"><label for="mn" style="font-size:13px;font-weight:600">Minimum notice</label><input id="mn" value="2 hours" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
        <div style="display:flex;flex-direction:column;gap:4px"><label for="ma" style="font-size:13px;font-weight:600">Max advance</label><input id="ma" value="15 days" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
        <div style="display:flex;flex-direction:column;gap:4px"><label for="cr" style="font-size:13px;font-weight:600">Free cancel until</label><input id="cr" value="1 hour before" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600">Verification documents required</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><label style="display:flex;gap:6px;padding:8px 12px;border-radius:9px;border:1px solid #CBD2DB"><input type="checkbox" checked> Aadhaar</label><label style="display:flex;gap:6px;padding:8px 12px;border-radius:9px;border:1px solid #CBD2DB"><input type="checkbox" checked> PAN</label><label style="display:flex;gap:6px;padding:8px 12px;border-radius:9px;border:1px solid #CBD2DB"><input type="checkbox" checked> Address proof</label><label style="display:flex;gap:6px;padding:8px 12px;border-radius:9px;border:1px solid #CBD2DB"><input type="checkbox"> Police verification</label><label style="display:flex;gap:6px;padding:8px 12px;border-radius:9px;border:1px solid #CBD2DB"><input type="checkbox"> Driving licence</label></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:18px;height:18px"> Ask for employment history &amp; resume (office staff style profile)</label>
      <div style="display:flex;gap:8px;justify-content:flex-end;border-top:1px solid #E3E6EB;padding-top:14px;flex-wrap:wrap"><button style="padding:11px 16px;border-radius:10px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 14px Hind,sans-serif;color:#13213C;cursor:pointer">Deactivate</button><button style="padding:11px 18px;border-radius:10px;border:0;background:#0B6E4F;color:#FFFFFF;font:700 14px Hind,sans-serif;cursor:pointer">Save service</button></div>
    </section>
  </div>
</main>

</script>
