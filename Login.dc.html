<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karvia · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Hind',system-ui,sans-serif;color:#13213C;background:#F4F6F9}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.1}
p{margin:0}
a{color:#0B6E4F}a:hover{color:#08523B}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-tpl">
<div style="min-height:900px;background:#F4F6F9;display:flex;flex-wrap:wrap">
  <div style="flex:1 1 480px;min-width:0;background:#0B6E4F;color:#FFFFFF;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px">
    <a href="Main.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#FFFFFF"><span style="width:36px;height:36px;border-radius:10px;background:#FFFFFF;color:#0B6E4F;display:flex;align-items:center;justify-content:center;font:800 22px 'Baloo 2',sans-serif">K</span><span style="font:800 26px 'Baloo 2',sans-serif">karvia</span></a>
    <div style="display:flex;flex-direction:column;gap:16px;max-width:460px">
      <h1 style="font-size:48px;font-weight:800;color:#FFFFFF">No password. Just your mobile number.</h1>
      <p style="font-size:18px;line-height:1.5;color:#D3EDE3">We send a one-time code by SMS. Same login for clients and workers.</p>
    </div>
    <p style="font-size:14px;color:#BFE3D5">By continuing you agree to the <a href="Legal.dc.html" style="color:#FFFFFF">Terms</a> and <a href="Legal.dc.html" style="color:#FFFFFF">Privacy Policy</a>.</p>
  </div>

  <div style="flex:1 1 480px;min-width:0;display:flex;align-items:center;justify-content:center;padding:48px 24px">
    <div style="width:100%;max-width:420px;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:14px;font-weight:600;color:#5E6B7D">I want to</span>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
          <button onClick="{{pickClient}}" style="{{clientBtn}}"><b style="display:block;font-size:16px">Kaam karwao</b><span style="font-size:13px">Find a worker</span></button>
          <button onClick="{{pickWorker}}" style="{{workerBtn}}"><b style="display:block;font-size:16px">Kaam pao</b><span style="font-size:13px">Get work</span></button>
        </div>
      </div>

      <sc-if value="{{isPhone}}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:8px">
          <label for="mob" style="font-weight:600">Mobile number</label>
          <div style="display:flex;border:1px solid #CBD2DB;border-radius:12px;overflow:hidden">
            <span style="padding:14px 12px;background:#F4F6F9;font-weight:600;border-right:1px solid #CBD2DB">+91</span>
            <input id="mob" inputmode="numeric" value="98765 43210" style="flex:1;min-width:0;padding:14px;border:0;font:inherit;font-size:18px;letter-spacing:.04em">
          </div>
        </div>
        <button onClick="{{sendOtp}}" style="padding:15px;border-radius:12px;border:0;background:#0B6E4F;color:#FFFFFF;font:600 17px Hind,sans-serif;cursor:pointer">Send OTP</button>
      </sc-if>

      <sc-if value="{{isOtp}}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;align-items:baseline"><label for="o1" style="font-weight:600">Enter 6-digit OTP</label><button onClick="{{back}}" style="border:0;background:none;color:#0B6E4F;font:600 14px Hind,sans-serif;cursor:pointer">Change number</button></div>
          <p style="font-size:14px;color:#5E6B7D">Sent to +91 98765 43210</p>
          <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px">
            <input id="o1" value="4" aria-label="Digit 1" style="text-align:center;padding:14px 0;border:1px solid #0B6E4F;border-radius:10px;font:700 22px Hind,sans-serif">
            <input value="8" aria-label="Digit 2" style="text-align:center;padding:14px 0;border:1px solid #0B6E4F;border-radius:10px;font:700 22px Hind,sans-serif">
            <input value="2" aria-label="Digit 3" style="text-align:center;padding:14px 0;border:1px solid #0B6E4F;border-radius:10px;font:700 22px Hind,sans-serif">
            <input value="1" aria-label="Digit 4" style="text-align:center;padding:14px 0;border:1px solid #0B6E4F;border-radius:10px;font:700 22px Hind,sans-serif">
            <input aria-label="Digit 5" style="text-align:center;padding:14px 0;border:1px solid #CBD2DB;border-radius:10px;font:700 22px Hind,sans-serif">
            <input aria-label="Digit 6" style="text-align:center;padding:14px 0;border:1px solid #CBD2DB;border-radius:10px;font:700 22px Hind,sans-serif">
          </div>
          <p style="font-size:14px;color:#5E6B7D">Resend OTP in 0:24</p>
        </div>
        <a href="{{nextHref}}" style="padding:15px;border-radius:12px;background:#0B6E4F;color:#FFFFFF;font-weight:600;font-size:17px;text-align:center;text-decoration:none">Verify and continue</a>
      </sc-if>

      <div style="display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#5E6B7D;border-top:1px solid #E3E6EB;padding-top:14px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E6B7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
        <span>Max 5 OTP requests per hour per number. Email is optional and can be added later.</span>
      </div>
    </div>
  </div>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { role: 'client', step: 'phone' }; }
  renderVals() {
    const on = 'text-align:left;padding:12px 14px;border-radius:12px;border:2px solid #0B6E4F;background:#E3F2EC;color:#0B6E4F;font-family:Hind,sans-serif;cursor:pointer';
    const off = 'text-align:left;padding:12px 14px;border-radius:12px;border:2px solid #E3E6EB;background:#FFFFFF;color:#3D4A5C;font-family:Hind,sans-serif;cursor:pointer';
    const c = this.state.role === 'client';
    return {
      clientBtn: c ? on : off, workerBtn: c ? off : on,
      pickClient: () => this.setState({ role: 'client' }),
      pickWorker: () => this.setState({ role: 'worker' }),
      isPhone: this.state.step === 'phone', isOtp: this.state.step === 'otp',
      sendOtp: () => this.setState({ step: 'otp' }),
      back: () => this.setState({ step: 'phone' }),
      nextHref: c ? 'ClientOnboarding.dc.html' : 'WorkerRegister.dc.html'
    };
  }
}
</script>
<a href="screens.html" style="position:fixed;right:16px;bottom:16px;z-index:999;padding:10px 14px;border-radius:999px;background:#13213C;color:#FFFFFF;font:600 14px Hind,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px -8px rgba(19,33,60,.5)">All screens</a>
<script src="support.js"></script>
</body>
</html>
