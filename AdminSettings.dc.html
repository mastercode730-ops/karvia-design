<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karvia Admin · Business settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Hind',system-ui,sans-serif;color:#13213C;background:#F4F6F9}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.1}
p{margin:0}
a{color:#0B6E4F}a:hover{color:#08523B}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-tpl">
<div style="min-height:1500px;background:#F4F6F9;display:flex;flex-wrap:wrap">
<nav style="flex:1 1 230px;max-width:250px;background:#0E1830;padding:18px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px">
  <a href="AdminDashboard.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#FFFFFF;padding:4px 8px 16px"><span style="width:30px;height:30px;border-radius:8px;background:#0B6E4F;display:flex;align-items:center;justify-content:center;font:800 18px 'Baloo 2',sans-serif">K</span><span style="font:800 20px 'Baloo 2',sans-serif">karvia</span><span style="font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:#22314F;color:#8FD3BA">ADMIN</span></a>
  <a href="AdminDashboard.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Dashboard</a>
  <a href="AdminVerification.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Verification</a>
  <a href="AdminWorkerDetail.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Workers</a>
  <a href="AdminClients.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Clients</a>
  <a href="AdminBookings.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Requests &amp; bookings</a>
  <a href="AdminPayments.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Payments &amp; plans</a>
  <a href="AdminComplaints.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Complaints</a>
  <a href="AdminLeads.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Leads</a>
  <a href="TelecallerConsole.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Telecaller view</a>
  <span style="padding:14px 12px 4px;color:#7D8AA3;font-size:11px;font-weight:700;letter-spacing:.08em">CONFIGURATION</span>
  <a href="AdminCategories.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Categories</a>
  <a href="AdminMatching.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Matching rules</a>
  <a href="AdminSettings.dc.html" style="padding:9px 12px;border-radius:8px;background:#22314F;color:#FFFFFF;font-weight:700;text-decoration:none">Business settings</a>
  <a href="AdminRoles.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Roles &amp; audit log</a>
</nav>

<main style="flex:999 1 560px;min-width:0;padding:24px 28px 48px;display:flex;flex-direction:column;gap:16px">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap"><div><h1 style="font-size:34px;font-weight:800">Business settings</h1><p style="color:#5E6B7D">Change business rules without a developer. Every save is audited.</p></div><button style="padding:11px 18px;border-radius:10px;border:0;background:#0B6E4F;color:#FFFFFF;font:700 15px Hind,sans-serif;cursor:pointer">Save all</button></div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start">
    <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px">
      <b style="font-size:17px">Client access</b>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <div style="display:flex;flex-direction:column;gap:4px"><label for="cf" style="font-size:13px;font-weight:600">Fee (₹)</label><input id="cf" value="9" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
        <div style="display:flex;flex-direction:column;gap:4px"><label for="cd" style="font-size:13px;font-weight:600">Duration (days)</label><input id="cd" value="30" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;color:#5E6B7D"><input type="checkbox" disabled style="width:18px;height:18px"> Auto-renewal (locked off by policy)</label>
      <div style="display:flex;flex-direction:column;gap:4px"><label for="cr" style="font-size:13px;font-weight:600">Expiry reminders</label><input id="cr" value="3 days and 1 day before" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
    </section>
    <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px">
      <b style="font-size:17px">Worker plan &amp; trial</b>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <div style="display:flex;flex-direction:column;gap:4px"><label for="wf" style="font-size:13px;font-weight:600">Plan price (₹)</label><input id="wf" value="199" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
        <div style="display:flex;flex-direction:column;gap:4px"><label for="wd" style="font-size:13px;font-weight:600">Plan days</label><input id="wd" value="30" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600">Free trial length</span><div style="display:flex;gap:6px"><span style="padding:8px 14px;border-radius:9px;background:#0B6E4F;color:#FFFFFF;font-weight:700">5 days</span><span style="padding:8px 14px;border-radius:9px;border:1px solid #CBD2DB">10 days</span></div></div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <div style="display:flex;flex-direction:column;gap:4px"><label for="gp" style="font-size:13px;font-weight:600">Grace period</label><input id="gp" value="0 days (off)" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
        <div style="display:flex;flex-direction:column;gap:4px"><label for="tp" style="font-size:13px;font-weight:600">Trials per mobile</label><input id="tp" value="1" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
      </div>
    </section>
    <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px">
      <b style="font-size:17px">Requests, quotes &amp; cancellations</b>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <div style="display:flex;flex-direction:column;gap:4px"><label for="rt" style="font-size:13px;font-weight:600">Accept timeout</label><input id="rt" value="60 s" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
        <div style="display:flex;flex-direction:column;gap:4px"><label for="qv" style="font-size:13px;font-weight:600">Quote validity</label><input id="qv" value="30 min" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
        <div style="display:flex;flex-direction:column;gap:4px"><label for="lc" style="font-size:13px;font-weight:600">Late cancel window</label><input id="lc" value="1 h before slot" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
        <div style="display:flex;flex-direction:column;gap:4px"><label for="ns" style="font-size:13px;font-weight:600">No-shows before suspend</label><input id="ns" value="2" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
      </div>
    </section>
    <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px">
      <b style="font-size:17px">Tax / GST</b>
      <p style="font-size:13px;color:#8A5A00;background:#FFF3DC;border-radius:8px;padding:8px 10px">Set only as advised by the company's CA. Nothing is hard-coded.</p>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <div style="display:flex;flex-direction:column;gap:4px"><label for="tx" style="font-size:13px;font-weight:600">Tax on client fee</label><input id="tx" value="[CA to confirm] %" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
        <div style="display:flex;flex-direction:column;gap:4px"><label for="tw" style="font-size:13px;font-weight:600">Tax on worker plan</label><input id="tw" value="[CA to confirm] %" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:18px;height:18px"> Prices shown include tax</label>
    </section>
    <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px">
      <b style="font-size:17px">Notification templates</b>
      <div style="display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid #E3E6EB"><span>Worker accepted (SMS + in-app)</span><a href="#">Edit</a></div>
      <div style="display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid #E3E6EB"><span>Trial ending (SMS)</span><a href="#">Edit</a></div>
      <div style="display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid #E3E6EB"><span>Payment success (in-app + email if present)</span><a href="#">Edit</a></div>
      <div style="display:flex;justify-content:space-between;font-size:14px;padding:6px 0"><span>Marketing (separate consent)</span><a href="#">Edit</a></div>
    </section>
    <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px">
      <b style="font-size:17px">Feature toggles</b>
      <label style="display:flex;justify-content:space-between;align-items:center"><span>Voice requirement (client)</span><input type="checkbox" checked style="width:20px;height:20px"></label>
      <label style="display:flex;justify-content:space-between;align-items:center"><span>Voice registration (worker)</span><input type="checkbox" checked style="width:20px;height:20px"></label>
      <label style="display:flex;justify-content:space-between;align-items:center"><span>Referral rewards</span><input type="checkbox" style="width:20px;height:20px"></label>
      <label style="display:flex;justify-content:space-between;align-items:center"><span>In-app chat</span><input type="checkbox" style="width:20px;height:20px"></label>
      <label style="display:flex;justify-content:space-between;align-items:center;color:#5E6B7D"><span>Secure payment / escrow (Phase 2)</span><input type="checkbox" disabled style="width:20px;height:20px"></label>
    </section>
  </div>
</main>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>

<script src="support.js"></script>
</body>
</html>
