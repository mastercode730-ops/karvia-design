<main style="max-width:1100px;margin:0 auto;padding:28px 24px 56px;display:flex;flex-direction:column;gap:18px">
  <h1 style="font-size:40px;font-weight:800">Documents &amp; verification</h1>
  <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;overflow-x:auto">
    <h2 style="font-size:22px">Your verification journey</h2>
    <div style="display:flex;gap:6px;align-items:center;min-width:820px;font-size:14px;font-weight:600">
      <span style="padding:8px 12px;border-radius:9px;background:#E3F2EC;color:#0B6E4F">✓ Registered</span><span style="color:#CBD2DB">—</span>
      <span style="padding:8px 12px;border-radius:9px;background:#E3F2EC;color:#0B6E4F">✓ Profile complete</span><span style="color:#CBD2DB">—</span>
      <span style="padding:8px 12px;border-radius:9px;background:#E3F2EC;color:#0B6E4F">✓ Documents</span><span style="color:#CBD2DB">—</span>
      <span style="padding:8px 12px;border-radius:9px;background:#F4A51C;color:#13213C">Under review</span><span style="color:#CBD2DB">—</span>

  </section>

  <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px">
    <h2 style="font-size:22px">Required for Plumber</h2>

    <div style="display:flex;gap:14px;align-items:center;padding:14px;border:1px solid #E3E6EB;border-radius:12px;flex-wrap:wrap"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3D4A5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 10h10"></path><path d="M7 14h6"></path></svg><div style="flex:1 1 240px"><b>PAN card</b><p style="font-size:14px;color:#5E6B7D">pan.pdf</p></div><span style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#E3F2EC;color:#0B6E4F">VERIFIED</span></div>
    <div style="display:flex;gap:14px;align-items:center;padding:14px;border:1px solid #F0C8C4;border-radius:12px;background:#FFF8F7;flex-wrap:wrap"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A3261F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"></path><path d="M12 17h.01"></path><circle cx="12" cy="12" r="9"></circle></svg><div style="flex:1 1 240px"><b>Address proof</b><p style="font-size:14px;color:#A3261F">Rejected: photo is blurry. Please upload a clear photo.</p></div><button style="padding:10px 14px;border-radius:10px;border:0;background:#13213C;color:#FFFFFF;font:600 14px Hind,sans-serif;cursor:pointer">Re-upload</button></div>
  </section>

  <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px">
    <h2 style="font-size:22px">Optional</h2>
    <div style="display:flex;gap:14px;align-items:center;padding:14px;border:1px dashed #CBD2DB;border-radius:12px;flex-wrap:wrap"><div style="flex:1 1 240px"><b>Skill certificate</b><p style="font-size:14px;color:#5E6B7D">ITI, training or employer letter. Adds a badge to your profile.</p></div><button style="padding:10px 14px;border-radius:10px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 14px Hind,sans-serif;color:#13213C;cursor:pointer">Upload</button></div>
    <div style="display:flex;gap:14px;align-items:center;padding:14px;border:1px dashed #CBD2DB;border-radius:12px;flex-wrap:wrap"><div style="flex:1 1 240px"><b>Police verification</b><p style="font-size:14px;color:#5E6B7D">Recommended for maids and drivers.</p></div><button style="padding:10px 14px;border-radius:10px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 14px Hind,sans-serif;color:#13213C;cursor:pointer">Upload</button></div>
  </section>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
    <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:14px"><span style="font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#F4F6F9;color:#3D4A5C">PENDING</span><p style="font-size:14px;margin-top:6px">Not submitted yet</p></div>
    <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:14px"><span style="font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#FFF3DC;color:#8A5A00">UNDER REVIEW</span><p style="font-size:14px;margin-top:6px">Admin is checking</p></div>
    <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:14px"><span style="font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#E3F2EC;color:#0B6E4F">VERIFIED</span><p style="font-size:14px;margin-top:6px">Visible to clients</p></div>
    <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:14px"><span style="font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#FBE4E2;color:#A3261F">REJECTED</span><p style="font-size:14px;margin-top:6px">Fix and resubmit</p></div>
    <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:14px"><span style="font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#13213C;color:#FFFFFF">SUSPENDED</span><p style="font-size:14px;margin-top:6px">Hidden from marketplace</p></div>
