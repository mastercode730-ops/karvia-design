<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karvia · My bookings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Hind',system-ui,sans-serif;color:#13213C;background:#F4F6F9}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.1}
p{margin:0}
a{color:#0B6E4F}a:hover{color:#08523B}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-tpl">
<div style="min-height:1300px;background:#F4F6F9">
<header style="background:#FFFFFF;border-bottom:1px solid #E3E6EB">
  <div style="max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px">
    <a href="ClientDashboard.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#13213C"><span style="width:34px;height:34px;border-radius:10px;background:#0B6E4F;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font:800 20px 'Baloo 2',sans-serif">K</span><span style="font:800 24px 'Baloo 2',sans-serif">karvia</span></a>
    <nav style="display:flex;flex-wrap:wrap;gap:4px;flex:1 1 480px;font-weight:500;font-size:15px">
      <a href="ClientDashboard.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">Home</a>
      <a href="FindWorkers.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">Find worker</a>
      <a href="RequestStatus.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">My requests</a>
      <a href="MyBookings.dc.html" style="padding:9px 12px;border-radius:9px;background:#E3F2EC;color:#0B6E4F;font-weight:700;text-decoration:none">My bookings</a>
      <a href="MyWorkers.dc.html" style="padding:9px 12px;border-radius:9px;color:#13213C;text-decoration:none">My workers</a>
    </nav>
    <a href="Payments.dc.html" style="padding:7px 12px;border-radius:999px;background:#FFF3DC;color:#8A5A00;font-size:14px;font-weight:600;text-decoration:none">₹9 access · 22 days left</a>
  </div>
</header>

<main style="max-width:1240px;margin:0 auto;padding:28px 24px 56px;display:flex;flex-direction:column;gap:18px">
  <h1 style="font-size:40px;font-weight:800">My bookings</h1>
  <div style="display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #E3E6EB">
    <a href="#" style="padding:10px 14px;color:#13213C;text-decoration:none;font-weight:700;border-bottom:3px solid #0B6E4F">Upcoming (2)</a>
    <a href="#" style="padding:10px 14px;color:#5E6B7D;text-decoration:none;font-weight:600">Active (1)</a>
    <a href="#" style="padding:10px 14px;color:#5E6B7D;text-decoration:none;font-weight:600">Completed (5)</a>
    <a href="#" style="padding:10px 14px;color:#5E6B7D;text-decoration:none;font-weight:600">Cancelled (0)</a>
    <a href="#" style="padding:10px 14px;color:#5E6B7D;text-decoration:none;font-weight:600">Disputed (0)</a>
  </div>
  <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;min-width:860px;font-size:15px">
      <thead><tr style="text-align:left;color:#5E6B7D;font-size:13px;text-transform:uppercase;letter-spacing:.05em"><th style="padding:14px 18px;border-bottom:1px solid #E3E6EB">Booking</th><th style="padding:14px 18px;border-bottom:1px solid #E3E6EB">Worker</th><th style="padding:14px 18px;border-bottom:1px solid #E3E6EB">When</th><th style="padding:14px 18px;border-bottom:1px solid #E3E6EB">Type</th><th style="padding:14px 18px;border-bottom:1px solid #E3E6EB">Agreed price</th><th style="padding:14px 18px;border-bottom:1px solid #E3E6EB">Status</th><th style="padding:14px 18px;border-bottom:1px solid #E3E6EB"></th></tr></thead>
      <tbody>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
          <tr>
            <td style="padding:14px 18px;border-bottom:1px solid #E3E6EB"><b>{{r.svc}}</b><span style="display:block;font-size:13px;color:#5E6B7D">{{r.id}}</span></td>
            <td style="padding:14px 18px;border-bottom:1px solid #E3E6EB">{{r.worker}}</td>
            <td style="padding:14px 18px;border-bottom:1px solid #E3E6EB">{{r.when}}</td>
            <td style="padding:14px 18px;border-bottom:1px solid #E3E6EB;color:#5E6B7D">{{r.type}}</td>
            <td style="padding:14px 18px;border-bottom:1px solid #E3E6EB;font-weight:600">{{r.price}}</td>
            <td style="padding:14px 18px;border-bottom:1px solid #E3E6EB"><span style="{{r.pill}}">{{r.status}}</span></td>
            <td style="padding:14px 18px;border-bottom:1px solid #E3E6EB;text-align:right"><a href="BookingDetail.dc.html" style="font-weight:600">Open</a></td>
          </tr>
        </sc-for>
      </tbody>
    </table>
  </div>
</main>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (bg, c) => 'font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:' + bg + ';color:' + c;
    return { rows: [
      { svc:'Tap / leak repair', id:'KRV-10482', worker:'Rakesh Yadav', when:'Sat 11 Oct, 10:00', type:'Scheduled', price:'₹300 + ₹500/hr', status:'CONFIRMED', pill:p('#E8EEFC','#1D4ED8') },
      { svc:'Driver · 8 hours', id:'KRV-10470', worker:'Imran Khan', when:'Tue 14 Oct, 09:00', type:'Scheduled', price:'₹1,000', status:'CONFIRMED', pill:p('#E8EEFC','#1D4ED8') },
      { svc:'Deep cleaning', id:'KRV-10466', worker:'Sunita Devi', when:'Today, 11:20', type:'Instant', price:'₹1,200 / day', status:'IN PROGRESS', pill:p('#E3F2EC','#0B6E4F') },
      { svc:'Fan installation', id:'KRV-10401', worker:'Arjun Mehta', when:'6 Oct', type:'Instant', price:'₹450', status:'COMPLETED', pill:p('#F4F6F9','#3D4A5C') },
      { svc:'2 labourers · 1 day', id:'KRV-10377', worker:'Ramesh + 1', when:'2 Oct', type:'Scheduled', price:'₹1,400', status:'COMPLETED', pill:p('#F4F6F9','#3D4A5C') },
      { svc:'Birthday DJ', id:'KRV-10322', worker:'DJ Sonu', when:'27 Sep', type:'Quote', price:'₹6,500', status:'COMPLETED', pill:p('#F4F6F9','#3D4A5C') }
    ] };
  }
}
</script>
<a href="screens.html" style="position:fixed;right:16px;bottom:16px;z-index:999;padding:10px 14px;border-radius:999px;background:#13213C;color:#FFFFFF;font:600 14px Hind,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px -8px rgba(19,33,60,.5)">All screens</a>
<script src="support.js"></script>
</body>
</html>
