<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karvia · Top workers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Hind',system-ui,sans-serif;color:#13213C;background:#FFFFFF}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.1}
p{margin:0}
a{color:#0B6E4F}a:hover{color:#08523B}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-tpl">
<div style="min-height:100%;background:#FFFFFF">
<header style="border-bottom:1px solid #E3E6EB;background:#FFFFFF">
  <div style="max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 32px">
    <a href="Main.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#13213C">
      <span style="width:36px;height:36px;border-radius:10px;background:#0B6E4F;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font:800 22px 'Baloo 2',sans-serif">K</span>
      <span style="font:800 26px 'Baloo 2',sans-serif;letter-spacing:-.01em">karvia</span>
    </a>
    <nav style="display:flex;flex-wrap:wrap;gap:4px 22px;flex:1 1 360px;font-weight:500">
      <a href="HowItWorks.dc.html" style="color:#13213C;text-decoration:none;padding:10px 0">How Karvia works</a>
      <a href="Categories.dc.html" style="color:#13213C;text-decoration:none;padding:10px 0">Categories</a>
      <a href="BecomeWorker.dc.html" style="color:#13213C;text-decoration:none;padding:10px 0">Become a worker</a>
      <a href="TopWorkers.dc.html" style="color:#13213C;text-decoration:none;padding:10px 0">Top workers</a>
      <a href="Help.dc.html" style="color:#13213C;text-decoration:none;padding:10px 0">Help</a>
    </nav>
    <div style="display:flex;gap:10px;align-items:center">
      <a href="Login.dc.html" style="padding:11px 18px;border-radius:10px;border:1px solid #CBD2DB;color:#13213C;text-decoration:none;font-weight:600">Login</a>
      <a href="Login.dc.html" style="padding:11px 18px;border-radius:10px;background:#0B6E4F;color:#FFFFFF;text-decoration:none;font-weight:600">Find a worker</a>
    </div>
  </div>
</header>

<section style="background:#13213C;color:#FFFFFF">
  <div style="max-width:1200px;margin:0 auto;padding:56px 24px 48px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between">
    <div style="flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:12px">
      <span style="align-self:flex-start;padding:5px 12px;border-radius:999px;background:#F4A51C;color:#13213C;font-weight:700;font-size:13px;letter-spacing:.06em">KARVIA STARS · OCTOBER 2026</span>
      <h1 style="font-size:52px;font-weight:800;color:#FFFFFF">Our best workers this month</h1>
      <p style="color:#C3CCDA;font-size:18px;max-width:60ch;line-height:1.5">Ranked from real client reviews, completed jobs and on-time record. Every Karvia Star is verified and gets a reward from Karvia.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:13px;color:#C3CCDA;font-weight:600">Showing city</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <sc-for list="{{cities}}" as="c"><button onClick="{{c.pick}}" style="{{c.style}}">{{c.name}}</button></sc-for>
      </div>
    </div>
  </div>
</section>

<main style="max-width:1200px;margin:0 auto;padding:32px 24px 72px;display:flex;flex-direction:column;gap:28px">
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <sc-for list="{{cats}}" as="c"><button onClick="{{c.pick}}" style="{{c.style}}">{{c.name}}</button></sc-for>
  </div>

  <sc-if value="{{hasTop}}">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">
    <sc-for list="{{top}}" as="w">
      <article style="{{w.card}}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <span style="{{w.medal}}">{{w.rankLabel}}</span>
          <span style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#E3F2EC;color:#0B6E4F">✓ VERIFIED</span>
        </div>
        <div style="display:flex;gap:14px;align-items:center">
          <span style="width:68px;height:68px;border-radius:50%;background:#DCE7F5;display:flex;align-items:center;justify-content:center;font:800 24px 'Baloo 2',sans-serif;flex:none">{{w.initials}}</span>
          <div style="min-width:0"><h2 style="font-size:24px">{{w.name}}</h2><p style="color:#5E6B7D">{{w.cat}} · {{w.area}}</p></div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center">
          <div style="background:#F4F6F9;border-radius:10px;padding:10px 4px"><b style="display:block;font:800 22px 'Baloo 2',sans-serif">{{w.rating}} ★</b><span style="font-size:12px;color:#5E6B7D">{{w.reviews}} reviews</span></div>
          <div style="background:#F4F6F9;border-radius:10px;padding:10px 4px"><b style="display:block;font:800 22px 'Baloo 2',sans-serif">{{w.jobs}}</b><span style="font-size:12px;color:#5E6B7D">jobs done</span></div>
          <div style="background:#F4F6F9;border-radius:10px;padding:10px 4px"><b style="display:block;font:800 22px 'Baloo 2',sans-serif">{{w.ontime}}</b><span style="font-size:12px;color:#5E6B7D">on time</span></div>
        </div>
        <p style="font-size:15px;color:#3D4A5C;font-style:italic;line-height:1.45">"{{w.quote}}"</p>
        <a href="Login.dc.html" style="padding:12px;border-radius:10px;background:#0B6E4F;color:#FFFFFF;text-decoration:none;font-weight:600;text-align:center">Book {{w.first}}</a>
      </article>
    </sc-for>
  </div>
  </sc-if>

  <sc-if value="{{hasRest}}">
  <section style="border:1px solid #E3E6EB;border-radius:18px;overflow:hidden">
    <div style="padding:14px 20px;background:#F4F6F9;font-weight:700">Also in the top 10</div>
    <sc-for list="{{rest}}" as="w">
      <div style="display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:14px 20px;border-top:1px solid #E3E6EB">
        <b style="width:28px;font:800 20px 'Baloo 2',sans-serif;color:#5E6B7D">{{w.rank}}</b>
        <span style="width:42px;height:42px;border-radius:50%;background:#DCE7F5;display:flex;align-items:center;justify-content:center;font-weight:700">{{w.initials}}</span>
        <div style="flex:1 1 200px;min-width:0"><b>{{w.name}}</b><p style="font-size:14px;color:#5E6B7D">{{w.cat}} · {{w.area}}</p></div>
        <span style="font-weight:700">{{w.rating}} ★ <span style="font-weight:400;color:#5E6B7D;font-size:14px">({{w.reviews}})</span></span>
        <span style="font-size:14px;color:#5E6B7D;width:110px">{{w.jobs}} jobs</span>
      </div>
    </sc-for>
  </section>
  </sc-if>

  <sc-if value="{{empty}}">
    <p style="padding:28px;border:1px dashed #CBD2DB;border-radius:16px;color:#5E6B7D;text-align:center">No Karvia Stars in this category and city yet. Rankings need at least 20 reviews in the last 90 days.</p>
  </sc-if>

  <div style="display:flex;flex-wrap:wrap;gap:16px">
    <section style="flex:1 1 440px;min-width:0;background:#F4F6F9;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px">
      <h2 style="font-size:26px">How we choose Karvia Stars</h2>
      <div style="display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:15px">
        <span>Average client rating (last 90 days)</span><b>40%</b>
        <span>Jobs completed</span><b>25%</b>
        <span>On time, no late cancellations</span><b>20%</b>
        <span>Repeat clients (rehired)</span><b>15%</b>
      </div>
      <p style="font-size:14px;color:#5E6B7D;line-height:1.5">Needs at least 20 reviews in 90 days. Workers with an open complaint, a warning or a suspension in the period are not ranked. Karvia reviews the list before it is published.</p>
    </section>
    <section style="flex:1 1 440px;min-width:0;background:#FFF3DC;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px">
      <h2 style="font-size:26px">Are you a worker?</h2>
      <p style="line-height:1.5">Top performers every month get a <b>cash reward, free plan days or a gift</b>, a Karvia Star badge on their profile, and more visibility to clients.</p>
      <a href="BecomeWorker.dc.html" style="align-self:flex-start;padding:12px 18px;border-radius:10px;background:#13213C;color:#FFFFFF;text-decoration:none;font-weight:600">Join Karvia</a>
      <p style="font-size:13px;color:#5E6B7D">Only first name, last initial, service and area are shown here. Phone numbers, prices and addresses stay private. Workers can choose not to appear.</p>
    </section>
  </div>
</main>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { city: 'Delhi NCR', cat: 'All' }; }
  renderVals() {
    const W = [
      ['Rakesh Y.', 'Plumber', 'Noida Sec 63', 4.9, 128, 212, '98%', 'Came in 20 minutes and fixed the leak properly. Very polite.'],
      ['Sunita D.', 'Maid', 'Indirapuram', 4.9, 96, 180, '99%', 'Most reliable help we have had. Never late.'],
      ['Arjun M.', 'Electrician', 'Noida Sec 50', 4.8, 110, 164, '97%', 'Explained the wiring problem clearly and charged what he quoted.'],
      ['Imran K.', 'Driver', 'Sector 18', 4.8, 74, 151, '96%', 'Safe driver, knew all the routes.'],
      ['Pooja R.', 'Maid', 'Vaishali', 4.7, 58, 133, '97%', ''],
      ['Mohan S.', 'Plumber', 'Sector 62', 4.7, 61, 140, '95%', ''],
      ['Salim A.', 'Electrician', 'Laxmi Nagar', 4.6, 55, 120, '95%', ''],
      ['Deepak T.', 'Painter', 'Greater Noida', 4.7, 42, 66, '94%', ''],
      ['Ravi P.', 'Labour', 'Noida Sec 63', 4.6, 37, 98, '93%', ''],
      ['Kavita N.', 'Maid', 'Sector 61', 4.6, 33, 87, '96%', '']
    ].map((w, i) => ({ name: w[0], first: w[0].split(' ')[0], initials: w[0].replace(/[^A-Z]/g, ''), cat: w[1], area: w[2], rating: w[3], reviews: w[4], jobs: w[5], ontime: w[6], quote: w[7] }));
    const city = this.state.city, cat = this.state.cat;
    const list = city === 'Delhi NCR' ? W.filter(w => cat === 'All' || w.cat === cat) : [];
    list.forEach((w, i) => { w.rank = i + 1; });
    const medals = ['#F4A51C', '#A9B4C2', '#C98A4B'];
    const top = list.slice(0, 3).map((w, i) => Object.assign(w, {
      rankLabel: ['🥇 #1 · Star of the month', '🥈 #2', '🥉 #3'][i],
      medal: 'font-weight:800;font-size:14px;padding:6px 12px;border-radius:999px;color:#13213C;background:' + medals[i],
      card: 'border:' + (i === 0 ? '2px solid #F4A51C' : '1px solid #E3E6EB') + ';border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;background:#FFFFFF' + (i === 0 ? ';box-shadow:0 18px 40px -24px rgba(183,121,31,.6)' : '')
    }));
    const chip = (on, dark) => 'padding:8px 14px;border-radius:999px;font:600 14px Hind,sans-serif;cursor:pointer;border:1px solid ' + (dark ? (on ? '#F4A51C;background:#F4A51C;color:#13213C' : '#2E3D5C;background:transparent;color:#FFFFFF') : (on ? '#13213C;background:#13213C;color:#FFFFFF' : '#CBD2DB;background:#FFFFFF;color:#13213C'));
    return {
      cities: ['Delhi NCR', 'Ambala', 'Chandigarh'].map(n => ({ name: n, style: chip(n === city, true), pick: () => this.setState({ city: n }) })),
      cats: ['All', 'Plumber', 'Electrician', 'Maid', 'Driver', 'Painter', 'Labour'].map(n => ({ name: n, style: chip(n === cat, false), pick: () => this.setState({ cat: n }) })),
      top, rest: list.slice(3), hasTop: top.length > 0, hasRest: list.length > 3, empty: list.length === 0
    };
  }
}
</script>
<a href="screens.html" style="position:fixed;right:16px;bottom:16px;z-index:999;padding:10px 14px;border-radius:999px;background:#13213C;color:#FFFFFF;font:600 14px Hind,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px -8px rgba(19,33,60,.5)">All screens</a>
<script src="support.js"></script>
</body>
</html>
