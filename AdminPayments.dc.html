<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karvia Admin · Payments and plans</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Hind',system-ui,sans-serif;color:#13213C;background:#F4F6F9}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.1}
p{margin:0}
a{color:#0B6E4F}a:hover{color:#08523B}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-tpl">
<div style="min-height:1200px;background:#F4F6F9;display:flex;flex-wrap:wrap">
<nav style="flex:1 1 230px;max-width:250px;background:#0E1830;padding:18px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px">
  <a href="AdminDashboard.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#FFFFFF;padding:4px 8px 16px"><span style="width:30px;height:30px;border-radius:8px;background:#0B6E4F;display:flex;align-items:center;justify-content:center;font:800 18px 'Baloo 2',sans-serif">K</span><span style="font:800 20px 'Baloo 2',sans-serif">karvia</span><span style="font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:#22314F;color:#8FD3BA">ADMIN</span></a>
  <a href="AdminDashboard.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Dashboard</a>
  <a href="AdminVerification.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Verification</a>
  <a href="AdminWorkerDetail.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Workers</a>
  <a href="AdminClients.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Clients</a>
  <a href="AdminBookings.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Requests &amp; bookings</a>
  <a href="AdminPayments.dc.html" style="padding:9px 12px;border-radius:8px;background:#22314F;color:#FFFFFF;font-weight:700;text-decoration:none">Payments &amp; plans</a>
  <a href="AdminComplaints.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Complaints</a>
  <a href="AdminLeads.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Leads</a>
  <a href="TelecallerConsole.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Telecaller view</a>
  <a href="AdminRewards.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Top performers</a>
  <a href="AdminMeetings.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Worker meetings</a>
  <span style="padding:14px 12px 4px;color:#7D8AA3;font-size:11px;font-weight:700;letter-spacing:.08em">CONFIGURATION</span>
  <a href="AdminCategories.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Categories</a>
  <a href="AdminMatching.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Matching rules</a>
  <a href="AdminSettings.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Business settings</a>
  <a href="AdminRoles.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Roles &amp; audit log</a>
</nav>

<main style="flex:999 1 560px;min-width:0;padding:24px 28px 48px;display:flex;flex-direction:column;gap:16px">
  <h1 style="font-size:34px;font-weight:800">Payments &amp; subscriptions</h1>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px">
    <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:12px;padding:14px"><span style="font-size:13px;color:#5E6B7D">Client ₹9 · today</span><b style="display:block;font:800 26px 'Baloo 2',sans-serif">₹3,114</b><span style="font-size:12px;color:#5E6B7D">346 payments</span></div>
    <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:12px;padding:14px"><span style="font-size:13px;color:#5E6B7D">Worker ₹199 · today</span><b style="display:block;font:800 26px 'Baloo 2',sans-serif">₹5,771</b><span style="font-size:12px;color:#5E6B7D">29 payments</span></div>
    <div style="background:#FFFFFF;border:1px solid #F0DDB4;border-radius:12px;padding:14px"><span style="font-size:13px;color:#5E6B7D">Pending webhook</span><b style="display:block;font:800 26px 'Baloo 2',sans-serif;color:#8A5A00">3</b><span style="font-size:12px;color:#5E6B7D">access still locked</span></div>
    <div style="background:#FFFFFF;border:1px solid #F0C8C4;border-radius:12px;padding:14px"><span style="font-size:13px;color:#5E6B7D">Duplicate / disputed</span><b style="display:block;font:800 26px 'Baloo 2',sans-serif;color:#A3261F">2</b><span style="font-size:12px;color:#5E6B7D">needs review</span></div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <input aria-label="Search payments" placeholder="Search mobile, transaction ID" style="flex:1 1 260px;padding:10px 12px;border-radius:9px;border:1px solid #CBD2DB;font:inherit;background:#FFFFFF">
    <select aria-label="Type" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit;background:#FFFFFF"><option>All types</option><option>Client access ₹9</option><option>Worker plan ₹199</option></select>
    <select aria-label="Status" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit;background:#FFFFFF"><option>All statuses</option><option>Success</option><option>Pending</option><option>Failed</option><option>Refunded</option></select>
  </div>
  <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;min-width:960px;font-size:14px">
      <thead><tr style="text-align:left;color:#5E6B7D;font-size:12px;text-transform:uppercase;letter-spacing:.04em"><th style="padding:12px 14px;border-bottom:1px solid #E3E6EB">Time</th><th style="padding:12px 14px;border-bottom:1px solid #E3E6EB">User</th><th style="padding:12px 14px;border-bottom:1px solid #E3E6EB">Plan</th><th style="padding:12px 14px;border-bottom:1px solid #E3E6EB">Amount</th><th style="padding:12px 14px;border-bottom:1px solid #E3E6EB">Gateway ID</th><th style="padding:12px 14px;border-bottom:1px solid #E3E6EB">Webhook</th><th style="padding:12px 14px;border-bottom:1px solid #E3E6EB">Status</th><th style="padding:12px 14px;border-bottom:1px solid #E3E6EB"></th></tr></thead>
      <tbody>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
          <tr><td style="padding:12px 14px;border-bottom:1px solid #E3E6EB;color:#5E6B7D">{{r.t}}</td><td style="padding:12px 14px;border-bottom:1px solid #E3E6EB"><b>{{r.u}}</b><span style="display:block;font-size:12px;color:#5E6B7D">{{r.role}}</span></td><td style="padding:12px 14px;border-bottom:1px solid #E3E6EB">{{r.plan}}</td><td style="padding:12px 14px;border-bottom:1px solid #E3E6EB;font-weight:600">{{r.amt}}</td><td style="padding:12px 14px;border-bottom:1px solid #E3E6EB;color:#5E6B7D">{{r.gid}}</td><td style="padding:12px 14px;border-bottom:1px solid #E3E6EB">{{r.wh}}</td><td style="padding:12px 14px;border-bottom:1px solid #E3E6EB"><span style="{{r.pill}}">{{r.st}}</span></td><td style="padding:12px 14px;border-bottom:1px solid #E3E6EB;text-align:right;white-space:nowrap"><a href="#" style="font-weight:600">{{r.act}}</a></td></tr>
        </sc-for>
      </tbody>
    </table>
  </div>
  <p style="font-size:13px;color:#5E6B7D">Access unlocks only when the server receives a signed payment.captured webhook. Refunds are manual and logged. Job payments between client and worker are not processed by Karvia in Phase 1.</p>
</main>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const pill = (bg, c) => 'font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:' + bg + ';color:' + c;
    const ok = pill('#E3F2EC','#0B6E4F'), pe = pill('#FFF3DC','#8A5A00'), fa = pill('#FBE4E2','#A3261F'), du = pill('#13213C','#FFFFFF');
    return { rows: [
      { t:'10:03', u:'Priya Sharma', role:'Client', plan:'Access 30 d', amt:'₹9', gid:'pay_Q8x2…41', wh:'✓ captured', st:'SUCCESS', pill:ok, act:'Receipt' },
      { t:'10:01', u:'Priya Sharma', role:'Client', plan:'Access 30 d', amt:'₹9', gid:'pay_Q8x1…07', wh:'✕ failed', st:'FAILED', pill:fa, act:'View' },
      { t:'09:58', u:'Rakesh Yadav', role:'Worker', plan:'Pro 30 d', amt:'₹199', gid:'pay_Q8w9…12', wh:'✓ captured', st:'SUCCESS', pill:ok, act:'Receipt' },
      { t:'09:55', u:'Karan Mehta', role:'Client', plan:'Access 30 d', amt:'₹9', gid:'pay_Q8w7…88', wh:'… waiting', st:'PENDING', pill:pe, act:'Re-check' },
      { t:'09:40', u:'Amit Rawal', role:'Client', plan:'Access 30 d', amt:'₹9', gid:'pay_Q8v1…20', wh:'✓ captured ×2', st:'DUPLICATE', pill:du, act:'Refund 1' },
      { t:'09:31', u:'Sunita Devi', role:'Worker', plan:'Trial extended +5 d', amt:'₹0', gid:'admin', wh:'—', st:'MANUAL', pill:pe, act:'Audit' },
      { t:'09:12', u:'Imran Khan', role:'Worker', plan:'Pro 30 d', amt:'₹199', gid:'pay_Q8u4…63', wh:'✓ captured', st:'SUCCESS', pill:ok, act:'Receipt' }
    ] };
  }
}
</script>
<a href="screens.html" style="position:fixed;right:16px;bottom:16px;z-index:999;padding:10px 14px;border-radius:999px;background:#13213C;color:#FFFFFF;font:600 14px Hind,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px -8px rgba(19,33,60,.5)">All screens</a>
<script src="support.js"></script>
</body>
</html>
