    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">
      <a href="AdminVerification.dc.html" style="background:#FFFFFF;border:1px solid #F0DDB4;border-radius:12px;padding:14px;text-decoration:none;color:#13213C"><span style="font-size:13px;color:#5E6B7D">Pending verification</span><b style="display:block;font:800 28px 'Baloo 2',sans-serif;color:#8A5A00">18</b></a>

      <a href="AdminComplaints.dc.html" style="background:#FFFFFF;border:1px solid #F0C8C4;border-radius:12px;padding:14px;text-decoration:none;color:#13213C"><span style="font-size:13px;color:#5E6B7D">Open complaints</span><b style="display:block;font:800 28px 'Baloo 2',sans-serif;color:#A3261F">5</b></a>
      <a href="AdminLeads.dc.html" style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:12px;padding:14px;text-decoration:none;color:#13213C"><span style="font-size:13px;color:#5E6B7D">Unassigned leads</span><b style="display:block;font:800 28px 'Baloo 2',sans-serif">42</b></a>
      <a href="AdminPayments.dc.html" style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:12px;padding:14px;text-decoration:none;color:#13213C"><span style="font-size:13px;color:#5E6B7D">Payment issues</span><b style="display:block;font:800 28px 'Baloo 2',sans-serif">2</b></a>
    </div>
  </section>

  <div style="display:flex;flex-wrap:wrap;gap:14px">

      </div>
    </section>
    <section style="flex:1 1 300px;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px">
      <b>Clients</b>
      <div style="display:grid;grid-template-columns:1fr auto;gap:6px;font-size:14px">
        <span>New this week</span><b>904</b><span>Active ₹9 access</span><b>3,215</b><span>Access expiring in 3 days</span><b>288</b><span>Suspended</span><b>4</b>

    <div style="display:flex;flex-direction:column;gap:8px;font-size:14px">
      <div style="display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center"><span>Requested</span><span style="height:22px;border-radius:5px;background:#13213C;width:100%"></span><b style="text-align:right">2,940</b></div>
      <div style="display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center"><span>Sent to workers</span><span style="height:22px;border-radius:5px;background:#13213C;width:96%"></span><b style="text-align:right">2,822</b></div>
      <div style="display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center"><span>Accepted</span><span style="height:22px;border-radius:5px;background:#0B6E4F;width:81%"></span><b style="text-align:right">2,381</b></div>
      <div style="display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center"><span>Confirmed</span><span style="height:22px;border-radius:5px;background:#0B6E4F;width:74%"></span><b style="text-align:right">2,176</b></div>

  <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;overflow-x:auto">

    <table style="width:100%;border-collapse:collapse;min-width:640px;font-size:14px">

        <tr><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">Sector 62, Noida</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">Maid</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">240</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">31</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB;color:#8A5A00;font-weight:700">9%</td></tr>
        <tr><td style="padding:10px 18px">Indirapuram</td><td style="padding:10px 18px">Driver</td><td style="padding:10px 18px">96</td><td style="padding:10px 18px">22</td><td style="padding:10px 18px;color:#0B6E4F;font-weight:700">2%</td></tr>
      </tbody>
    </table>
  </section>
