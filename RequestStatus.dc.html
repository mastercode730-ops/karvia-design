      <span style="padding:8px 12px;border-radius:9px;background:#E3F2EC;color:#0B6E4F">✓ Requested</span><span style="color:#CBD2DB">—</span>

      <p style="font-size:13px;color:#5E6B7D">Other workers now see "Request already assigned".</p>
    </section>

    <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px">

        <button style="padding:13px;border-radius:12px;border:0;background:#13213C;color:#FFFFFF;font:600 15px Hind,sans-serif;cursor:pointer">Search up to 10 KM</button>
        <a href="FindWorkers.dc.html" style="padding:13px;border-radius:12px;border:1px solid #CBD2DB;color:#13213C;text-decoration:none;font-weight:600;text-align:center">Pick a worker myself</a>
        <button style="padding:13px;border-radius:12px;border:1px solid #CBD2DB;background:#FFFFFF;color:#13213C;font:600 15px Hind,sans-serif;cursor:pointer">Change time</button>

    </section>
  </div>

    <h2 style="font-size:22px">Activity</h2>
    <div style="display:grid;grid-template-columns:90px 1fr;gap:8px 16px;font-size:15px">
      <span style="color:#5E6B7D">10:02:14</span><span>Request created · Scheduled for Sat 11 Oct, 10:00 AM</span>
      <span style="color:#5E6B7D">10:02:15</span><span>Matching found 6 eligible plumbers within 5 KM</span>
      <span style="color:#5E6B7D">10:02:16</span><span>Notification sent to 6 workers · 60 s window</span>
      <span style="color:#5E6B7D">10:02:31</span><span>Mohan S. declined</span>
