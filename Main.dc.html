<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3000}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { role: 'client' }; }
  renderVals() {
    const on = 'padding:10px 16px;border-radius:9px;border:0;background:#13213C;color:#FFFFFF;font:600 15px Hind,sans-serif;cursor:pointer';
    const off = 'padding:10px 16px;border-radius:9px;border:0;background:transparent;color:#3D4A5C;font:600 15px Hind,sans-serif;cursor:pointer';
    const c = this.state.role === 'client';
    return {
      isClient: c, isWorker: !c,
      clientTab: c ? on : off, workerTab: c ? off : on,
      pickClient: () => this.setState({ role: 'client' }),
      pickWorker: () => this.setState({ role: 'worker' })
    };
  }
}
</script>
