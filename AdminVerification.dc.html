<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karvia Admin · Verification queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Hind',system-ui,sans-serif;color:#13213C;background:#F4F6F9}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.1}
p{margin:0}
a{color:#0B6E4F}a:hover{color:#08523B}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-tpl">
<div style="min-height:1300px;background:#F4F6F9;display:flex;flex-wrap:wrap">
<nav style="flex:1 1 230px;max-width:250px;background:#0E1830;padding:18px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px">
  <a href="AdminDashboard.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#FFFFFF;padding:4px 8px 16px"><span style="width:30px;height:30px;border-radius:8px;background:#0B6E4F;display:flex;align-items:center;justify-content:center;font:800 18px 'Baloo 2',sans-serif">K</span><span style="font:800 20px 'Baloo 2',sans-serif">karvia</span><span style="font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:#22314F;color:#8FD3BA">ADMIN</span></a>
  <a href="AdminDashboard.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Dashboard</a>
  <a href="AdminVerification.dc.html" style="padding:9px 12px;border-radius:8px;background:#22314F;color:#FFFFFF;font-weight:700;text-decoration:none;display:flex;justify-content:space-between">Verification <span style="background:#F4A51C;color:#13213C;border-radius:999px;padding:0 7px;font-weight:700;font-size:12px">18</span></a>
  <a href="AdminWorkerDetail.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Workers</a>
  <a href="AdminClients.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Clients</a>
  <a href="AdminBookings.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Requests &amp; bookings</a>
  <a href="AdminPayments.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Payments &amp; plans</a>
  <a href="AdminComplaints.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Complaints</a>
  <a href="AdminLeads.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Leads</a>
  <a href="TelecallerConsole.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Telecaller view</a>
  <a href="AdminRewards.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Top performers</a>
  <a href="AdminMeetings.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Worker meetings</a>
  <span style="padding:14px 12px 4px;color:#7D8AA3;font-size:11px;font-weight:700;letter-spacing:.08em">CONFIGURATION</span>
  <a href="AdminCategories.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Categories</a>
  <a href="AdminMatching.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Matching rules</a>
  <a href="AdminSettings.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Business settings</a>
  <a href="AdminRoles.dc.html" style="padding:9px 12px;border-radius:8px;color:#C3CCDA;text-decoration:none">Roles &amp; audit log</a>
</nav>

<main style="flex:999 1 560px;min-width:0;padding:24px 28px 48px;display:flex;flex-direction:column;gap:16px">
  <h1 style="font-size:34px;font-weight:800">Worker verification</h1>
  <div style="display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #E3E6EB">
    <a href="#" style="padding:10px 14px;color:#13213C;text-decoration:none;font-weight:700;border-bottom:3px solid #0B6E4F">Ready for review (18)</a>
    <a href="#" style="padding:10px 14px;color:#5E6B7D;text-decoration:none;font-weight:600">Under review (6)</a>
    <a href="#" style="padding:10px 14px;color:#5E6B7D;text-decoration:none;font-weight:600">Incomplete (231)</a>
    <a href="#" style="padding:10px 14px;color:#5E6B7D;text-decoration:none;font-weight:600">Rejected (40)</a>
    <a href="#" style="padding:10px 14px;color:#5E6B7D;text-decoration:none;font-weight:600">Suspended (9)</a>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <input aria-label="Search" placeholder="Search name or mobile" style="flex:1 1 260px;padding:10px 12px;border-radius:9px;border:1px solid #CBD2DB;font:inherit;background:#FFFFFF">
    <select aria-label="Category" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit;background:#FFFFFF"><option>All categories</option></select>
    <select aria-label="City" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit;background:#FFFFFF"><option>All cities</option></select>
  </div>
  <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;min-width:900px;font-size:14px">
      <thead><tr style="text-align:left;color:#5E6B7D;font-size:12px;text-transform:uppercase;letter-spacing:.04em"><th style="padding:12px 16px;border-bottom:1px solid #E3E6EB">Worker</th><th style="padding:12px 16px;border-bottom:1px solid #E3E6EB">Category</th><th style="padding:12px 16px;border-bottom:1px solid #E3E6EB">Area</th><th style="padding:12px 16px;border-bottom:1px solid #E3E6EB">Profile</th><th style="padding:12px 16px;border-bottom:1px solid #E3E6EB">Documents</th><th style="padding:12px 16px;border-bottom:1px solid #E3E6EB">Submitted</th><th style="padding:12px 16px;border-bottom:1px solid #E3E6EB">Source</th><th style="padding:12px 16px;border-bottom:1px solid #E3E6EB"></th></tr></thead>
      <tbody>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
          <tr>
            <td style="padding:12px 16px;border-bottom:1px solid #E3E6EB"><b>{{r.name}}</b><span style="display:block;color:#5E6B7D;font-size:13px">{{r.mob}}</span></td>
            <td style="padding:12px 16px;border-bottom:1px solid #E3E6EB">{{r.cat}}</td>
            <td style="padding:12px 16px;border-bottom:1px solid #E3E6EB">{{r.area}}</td>
            <td style="padding:12px 16px;border-bottom:1px solid #E3E6EB"><div style="display:flex;align-items:center;gap:8px"><span style="width:70px;height:6px;border-radius:3px;background:#E3E6EB;overflow:hidden;display:block"><span style="{{r.bar}}"></span></span>{{r.pct}}</div></td>
            <td style="padding:12px 16px;border-bottom:1px solid #E3E6EB">{{r.docs}}</td>
            <td style="padding:12px 16px;border-bottom:1px solid #E3E6EB;color:#5E6B7D">{{r.when}}</td>
            <td style="padding:12px 16px;border-bottom:1px solid #E3E6EB;color:#5E6B7D">{{r.src}}</td>
            <td style="padding:12px 16px;border-bottom:1px solid #E3E6EB;text-align:right"><a href="AdminWorkerDetail.dc.html" style="padding:7px 12px;border-radius:8px;background:#13213C;color:#FFFFFF;text-decoration:none;font-weight:600">Review</a></td>
          </tr>
        </sc-for>
      </tbody>
    </table>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:#5E6B7D"><span>Bulk:</span><button style="padding:8px 12px;border-radius:8px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 13px Hind,sans-serif;color:#13213C;cursor:pointer">Assign to telecaller</button><button style="padding:8px 12px;border-radius:8px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 13px Hind,sans-serif;color:#13213C;cursor:pointer">Send reminder SMS</button><span style="margin-left:auto">1–7 of 18</span></div>
</main>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const bar = (p) => 'display:block;height:100%;background:' + (p >= 90 ? '#0B6E4F' : '#F4A51C') + ';width:' + p + '%';
    const r = (name, mob, cat, area, p, docs, when, src) => ({ name, mob, cat, area, pct: p + '%', bar: bar(p), docs, when, src });
    return { rows: [
      r('Rakesh Yadav', '98xxxxx210', 'Plumber', 'Noida 63', 100, '3 / 3', '2 h ago', 'Website'),
      r('Sunita Devi', '97xxxxx118', 'Maid', 'Noida 50', 95, '3 / 3', '3 h ago', 'Telecaller'),
      r('Imran Khan', '99xxxxx442', 'Driver', 'Indirapuram', 100, '4 / 4', '5 h ago', 'Referral'),
      r('Deepak Verma', '88xxxxx903', 'Electrician', 'Gr. Noida W', 92, '2 / 3', 'Yesterday', 'Voice'),
      r('Pooja Rani', '70xxxxx551', 'Office staff', 'Noida 18', 100, '3 / 3', 'Yesterday', 'Website'),
      r('DJ Sonu', '96xxxxx074', 'DJ / Event', 'Ghaziabad', 90, '2 / 2', '2 days', 'Website'),
      r('Ramesh Pal', '93xxxxx610', 'Labour', 'Noida 12', 91, '2 / 2', '2 days', 'Telecaller')
    ] };
  }
}
</script>
<a href="screens.html" style="position:fixed;right:16px;bottom:16px;z-index:999;padding:10px 14px;border-radius:999px;background:#13213C;color:#FFFFFF;font:600 14px Hind,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px -8px rgba(19,33,60,.5)">All screens</a>
<script src="support.js"></script>
</body>
</html>
