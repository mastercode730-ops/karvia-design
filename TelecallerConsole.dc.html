    <div style="display:flex;gap:14px;align-items:center;font-size:14px"><span>Today: <b>14 calls</b> · <b>3 converted</b></span><span style="width:36px;height:36px;border-radius:50%;background:#E8EEFC;color:#1D4ED8;display:flex;align-items:center;justify-content:center;font-weight:700">AN</span></div>
  </div>

  <section style="flex:1 1 300px;max-width:380px;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;overflow:hidden">

    <div style="padding:12px 14px;border-bottom:1px solid #E3E6EB"><b>Mukesh Rana</b><p style="font-size:13px;color:#5E6B7D">Painter · Noida 12</p><span style="font-size:12px;color:#5E6B7D;font-weight:700">INTERESTED</span></div>
    <div style="padding:12px 14px"><b>Ajay Tomar</b><p style="font-size:13px;color:#5E6B7D">Driver · Indirapuram</p><span style="font-size:12px;color:#5E6B7D;font-weight:700">CONTACTED</span></div>

      <div style="display:flex;gap:8px"><button style="display:flex;gap:8px;align-items:center;padding:12px 18px;border-radius:10px;border:0;background:#0B6E4F;color:#FFFFFF;font:700 15px Hind,sans-serif;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>Call</button><button style="padding:12px 16px;border-radius:10px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 15px Hind,sans-serif;color:#13213C;cursor:pointer">WhatsApp</button></div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start">
      <div style="flex:2 1 380px;min-width:0;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px">

        <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:13px"><span style="padding:4px 9px;border-radius:999px;background:#E3F2EC;color:#0B6E4F">✓ Name</span><span style="padding:4px 9px;border-radius:999px;background:#E3F2EC;color:#0B6E4F">✓ Photo</span><span style="padding:4px 9px;border-radius:999px;background:#E3F2EC;color:#0B6E4F">✓ Category</span><span style="padding:4px 9px;border-radius:999px;background:#E3F2EC;color:#0B6E4F">✓ Location</span><span style="padding:4px 9px;border-radius:999px;background:#FFF3DC;color:#8A5A00">Experience</span><span style="padding:4px 9px;border-radius:999px;background:#FFF3DC;color:#8A5A00">Pricing</span><span style="padding:4px 9px;border-radius:999px;background:#FFF3DC;color:#8A5A00">Documents</span></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <div style="flex:1 1 160px;display:flex;flex-direction:column;gap:4px"><label for="ex" style="font-size:13px;font-weight:600">Experience</label><input id="ex" value="6 years" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
          <div style="flex:1 1 160px;display:flex;flex-direction:column;gap:4px"><label for="vc" style="font-size:13px;font-weight:600">Visit charge (₹)</label><input id="vc" value="250" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
          <div style="flex:1 1 160px;display:flex;flex-direction:column;gap:4px"><label for="sk" style="font-size:13px;font-weight:600">Skills</label><input id="sk" value="Wiring, fan, inverter" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"></div>
        </div>
        <button style="align-self:flex-start;padding:10px 14px;border-radius:9px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 14px Hind,sans-serif;color:#13213C;cursor:pointer">Send document upload link by SMS</button>
        <div style="background:#F4F6F9;border-radius:10px;padding:12px;font-size:13px;color:#3D4A5C">Not available to telecallers: approve, reject, suspend, refund, payment rules, viewing Aadhaar images.</div>
      </div>

      <div style="flex:1 1 280px;min-width:0;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px">
        <b style="font-size:17px">Call outcome</b>
        <div style="display:flex;flex-wrap:wrap;gap:6px;font-size:13px">
          <span style="padding:7px 10px;border-radius:9px;border:1px solid #CBD2DB">Contacted</span>
          <span style="padding:7px 10px;border-radius:9px;background:#0B6E4F;color:#FFFFFF;font-weight:700">Interested</span>
          <span style="padding:7px 10px;border-radius:9px;border:1px solid #CBD2DB">Registration pending</span>
          <span style="padding:7px 10px;border-radius:9px;border:1px solid #CBD2DB">Payment pending</span>
          <span style="padding:7px 10px;border-radius:9px;border:1px solid #CBD2DB">Ready for verification</span>
          <span style="padding:7px 10px;border-radius:9px;border:1px solid #CBD2DB">Follow-up</span>
          <span style="padding:7px 10px;border-radius:9px;border:1px solid #CBD2DB">Not interested</span>

        <input id="fu" value="10 Oct 2026, 11:00 AM" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit">

        <textarea id="nt" rows="3" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit">Will upload Aadhaar tonight. Works mostly evenings.</textarea>
        <button style="padding:12px;border-radius:10px;border:0;background:#13213C;color:#FFFFFF;font:700 15px Hind,sans-serif;cursor:pointer">Save outcome</button>
      </div>
    </div>

    <div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px">
      <b style="font-size:17px">Activity history</b>
      <div style="display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:14px"><span style="color:#5E6B7D">Today 09:40</span><span>Anjali called · no answer</span><span style="color:#5E6B7D">8 Oct 18:10</span><span>Assigned to Anjali by Admin</span><span style="color:#5E6B7D">8 Oct 16:02</span><span>Registration stopped at step 4 (Experience)</span></div>
    </div>
  </section>
