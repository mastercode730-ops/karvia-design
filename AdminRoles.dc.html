<main style="flex:999 1 560px;min-width:0;padding:24px 28px 48px;display:flex;flex-direction:column;gap:16px">

    <table style="width:100%;border-collapse:collapse;min-width:980px;font-size:13px;text-align:center">
      <thead><tr style="color:#5E6B7D;font-size:11px;text-transform:uppercase;letter-spacing:.04em"><th style="padding:12px 14px;border-bottom:1px solid #E3E6EB;text-align:left">Role</th><th style="padding:12px 8px;border-bottom:1px solid #E3E6EB">Workers</th><th style="padding:12px 8px;border-bottom:1px solid #E3E6EB">Verify</th><th style="padding:12px 8px;border-bottom:1px solid #E3E6EB">Clients</th><th style="padding:12px 8px;border-bottom:1px solid #E3E6EB">Bookings</th><th style="padding:12px 8px;border-bottom:1px solid #E3E6EB">Payments</th><th style="padding:12px 8px;border-bottom:1px solid #E3E6EB">Refunds</th><th style="padding:12px 8px;border-bottom:1px solid #E3E6EB">Complaints</th><th style="padding:12px 8px;border-bottom:1px solid #E3E6EB">Leads</th><th style="padding:12px 8px;border-bottom:1px solid #E3E6EB">Categories</th><th style="padding:12px 8px;border-bottom:1px solid #E3E6EB">Settings</th><th style="padding:12px 8px;border-bottom:1px solid #E3E6EB">Members</th></tr></thead>
      <tbody>
        <sc-for list="{{roles}}" as="r" hint-placeholder-count="9">
          <tr>
            <td style="padding:11px 14px;border-bottom:1px solid #E3E6EB;text-align:left"><b>{{r.name}}</b></td>
            <sc-for list="{{r.p}}" as="c" hint-placeholder-count="10"><td style="padding:11px 8px;border-bottom:1px solid #E3E6EB"><span style="{{c.s}}">{{c.t}}</span></td></sc-for>
            <td style="padding:11px 8px;border-bottom:1px solid #E3E6EB">{{r.m}}</td>
          </tr>
        </sc-for>
      </tbody>
    </table>
  </div>
  <p style="font-size:13px;color:#5E6B7D">E = edit · V = view · — = hidden. Admin can toggle every cell. Sensitive payment and admin controls are hidden by default for new roles.</p>

  <section style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;overflow-x:auto">
    <div style="padding:16px 18px 6px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><b style="font-size:18px">Audit log</b><div style="display:flex;gap:8px;flex-wrap:wrap"><input aria-label="Search audit" placeholder="Search actor, entity, action" style="padding:8px 10px;border-radius:8px;border:1px solid #CBD2DB;font:inherit"><button style="padding:8px 12px;border-radius:8px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 13px Hind,sans-serif;color:#13213C;cursor:pointer">Export</button></div></div>
    <table style="width:100%;border-collapse:collapse;min-width:900px;font-size:14px">
      <thead><tr style="text-align:left;color:#5E6B7D;font-size:12px;text-transform:uppercase"><th style="padding:10px 18px;border-bottom:1px solid #E3E6EB">Time</th><th style="padding:10px 18px;border-bottom:1px solid #E3E6EB">Actor</th><th style="padding:10px 18px;border-bottom:1px solid #E3E6EB">Action</th><th style="padding:10px 18px;border-bottom:1px solid #E3E6EB">Entity</th><th style="padding:10px 18px;border-bottom:1px solid #E3E6EB">Before → After</th><th style="padding:10px 18px;border-bottom:1px solid #E3E6EB">Reason</th></tr></thead>
      <tbody>
        <tr><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB;color:#5E6B7D">10:21:04</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">Meera (Admin)</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB"><b>worker.approve</b></td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">W-20931 Rakesh Y.</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">UNDER_REVIEW → VERIFIED</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">Docs OK</td></tr>
        <tr><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB;color:#5E6B7D">09:31:40</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">Meera (Admin)</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB"><b>trial.extend</b></td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">W-20104 Sunita D.</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">ends 9 Oct → 14 Oct</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">App outage 6 Oct</td></tr>

        <tr><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB;color:#5E6B7D">08:47:55</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">Meera (Admin)</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB"><b>document.view</b></td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">W-20931 Aadhaar</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">—</td><td style="padding:10px 18px;border-bottom:1px solid #E3E6EB">Verification</td></tr>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const E = { t:'E', s:'display:inline-block;min-width:24px;padding:2px 6px;border-radius:5px;background:#E3F2EC;color:#0B6E4F;font-weight:700' };
    const V = { t:'V', s:'display:inline-block;min-width:24px;padding:2px 6px;border-radius:5px;background:#E8EEFC;color:#1D4ED8;font-weight:700' };
    const N = { t:'—', s:'display:inline-block;min-width:24px;color:#9AA5B4' };
    const row = (name, code, m) => ({ name, m, p: code.split('').map(ch => ch === 'E' ? E : ch === 'V' ? V : N) });
    return { roles: [
      row('Super admin',        'EEEEEEEEEE', '1'),
      row('Verification manager','EEVV-N--VN'.replace(/N/g,'-'), '2'),
      row('Worker manager',     'EVVV--V-V-', '2'),
      row('Client manager',     '--EV--V---', '1'),
      row('Booking manager',    'V-VE--V---', '2'),
      row('Payment manager',    'V-VVEE----', '1'),
      row('Complaint manager',  'VVVV--E---', '2'),
      row('Lead manager',       'V------E--', '1'),
      row('Telecaller',         '-------E--', '6')
    ] };
  }
}
</script>
