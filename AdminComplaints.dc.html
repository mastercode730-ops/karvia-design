  <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
    <section style="flex:1 1 320px;max-width:400px;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;overflow:hidden">

      <div style="padding:14px;border-bottom:1px solid #E3E6EB;background:#FFFBF2"><div style="display:flex;justify-content:space-between;gap:6px"><b>#C-2214 · Did not arrive</b><span style="font-size:11px;font-weight:700;color:#A3261F">HIGH</span></div><p style="font-size:13px;color:#5E6B7D">Priya S. → Rakesh Y. · ₹300 paid by UPI · 1 h ago</p></div>
      <div style="padding:14px;border-bottom:1px solid #E3E6EB"><div style="display:flex;justify-content:space-between;gap:6px"><b>#C-2213 · Harassment</b><span style="font-size:11px;font-weight:700;color:#A3261F">HIGH</span></div><p style="font-size:13px;color:#5E6B7D">Worker report · client Amit R. · 3 h ago</p></div>
      <div style="padding:14px;border-bottom:1px solid #E3E6EB"><div style="display:flex;justify-content:space-between;gap:6px"><b>#C-2210 · Overcharging</b><span style="font-size:11px;font-weight:700;color:#8A5A00">MEDIUM</span></div><p style="font-size:13px;color:#5E6B7D">Vikas S. → Kamal S. · quote v2 · Yesterday</p></div>
      <div style="padding:14px;border-bottom:1px solid #E3E6EB"><div style="display:flex;justify-content:space-between;gap:6px"><b>#C-2207 · Fake profile</b><span style="font-size:11px;font-weight:700;color:#8A5A00">MEDIUM</span></div><p style="font-size:13px;color:#5E6B7D">Client report · Electrician · 2 days</p></div>
      <div style="padding:14px"><div style="display:flex;justify-content:space-between;gap:6px"><b>#C-2201 · Accepted then cancelled</b><span style="font-size:11px;font-weight:700;color:#5E6B7D">LOW</span></div><p style="font-size:13px;color:#5E6B7D">Neha G. → Deepak V. · 3 days</p></div>
    </section>

    <section style="flex:999 1 480px;min-width:0;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h2 style="font-size:24px">#C-2214 · Worker did not arrive</h2><select aria-label="Status" style="padding:8px;border-radius:9px;border:1px solid #CBD2DB;font:inherit"><option>Open</option><option>Under review</option><option>Resolved</option></select></div>
      <div style="display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:14px">
        <span style="color:#5E6B7D">Booking</span><a href="AdminBookings.dc.html">KRV-10482 · Tap repair · Sat 11 Oct 10:00</a>
        <span style="color:#5E6B7D">Reported by</span><span>Priya Sharma (client)</span>
        <span style="color:#5E6B7D">Against</span><a href="AdminWorkerDetail.dc.html">Rakesh Yadav (W-20931) · 0 past warnings</a>
        <span style="color:#5E6B7D">Amount</span><span>₹300 paid directly by UPI</span>
      </div>
      <p style="background:#F4F6F9;border-radius:10px;padding:12px;font-size:15px">"Paid ₹300 advance by UPI on 10 Oct for the visit. Worker did not come on 11 Oct and is not answering."</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><div style="width:120px;height:90px;border-radius:10px;background:#E9EEF3;display:flex;align-items:center;justify-content:center;font-size:13px;color:#3D4A5C">upi_receipt.jpg</div><div style="width:120px;height:90px;border-radius:10px;background:#E9EEF3;display:flex;align-items:center;justify-content:center;font-size:13px;color:#3D4A5C">call_log.png</div></div>
      <div style="display:flex;flex-direction:column;gap:6px"><b>Worker's side</b><p style="font-size:14px;color:#3D4A5C">Requested via in-app message · no reply yet (deadline 24 h)</p></div>
      <div style="display:flex;flex-direction:column;gap:6px"><label for="nt" style="font-weight:600">Internal notes</label><textarea id="nt" rows="2" style="padding:10px;border-radius:9px;border:1px solid #CBD2DB;font:inherit">Called worker twice, phone off. Booking shows no "start job" event.</textarea></div>
      <div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid #E3E6EB;padding-top:14px">
        <b>Action</b>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button style="padding:10px 14px;border-radius:9px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 14px Hind,sans-serif;color:#13213C;cursor:pointer">Send warning</button>
          <button style="padding:10px 14px;border-radius:9px;border:1px solid #CBD2DB;background:#FFFFFF;font:600 14px Hind,sans-serif;color:#13213C;cursor:pointer">Send to verification review</button>
          <button style="padding:10px 14px;border-radius:9px;border:0;background:#8A5A00;color:#FFFFFF;font:600 14px Hind,sans-serif;cursor:pointer">Suspend 7 days</button>
          <button style="padding:10px 14px;border-radius:9px;border:0;background:#A3261F;color:#FFFFFF;font:600 14px Hind,sans-serif;cursor:pointer">Block worker</button>
          <button style="padding:10px 14px;border-radius:9px;border:0;background:#0B6E4F;color:#FFFFFF;font:600 14px Hind,sans-serif;cursor:pointer">Resolve</button>
        </div>
        <p style="font-size:12px;color:#5E6B7D">Karvia does not issue automatic refunds for direct payments. Resolution message is sent to both parties.</p>
      </div>
